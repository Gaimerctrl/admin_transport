<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмін-панель</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f8f9fa; --text: #1c1f23; --muted: #6b7280;
  --border: #e3e5e8; --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
    --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
  --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* кнопки та поля */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
.btn:hover { filter: brightness(.96); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 90px; }

/* вхід */
#login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.login-card .input { margin-bottom: 10px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0; }

/* каркас */
#app { display: flex; min-height: 100%; }
#side { width: 230px; flex: none; background: var(--panel); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
#side h2 { margin: 0 8px 14px; font-size: 17px; }
#side a.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text); text-decoration: none; }
#side a.nav:hover { background: var(--panel2); }
#side a.nav.active { background: var(--accent); color: var(--accent-text); }
#side .grow { flex: 1; }
.nbadge { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
#side a.nav.active .nbadge { background: #fff; color: var(--danger); }
#content { flex: 1; min-width: 0; }
#top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
#top h1 { margin: 0; font-size: 20px; flex: 1; }
.me { display: flex; align-items: center; gap: 8px; }
#main { padding: 22px 24px 60px; max-width: 1200px; }

/* компоненти */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.warn b { color: var(--warn); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.panel > h3 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--border); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .input { max-width: 280px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
.tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row.banned { background: rgba(220,38,38,.07); }
.row .info { flex: 1; min-width: 0; }
.row .info p { margin: 0; }
.row .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--panel2); flex: none; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px; margin-left: 6px; vertical-align: middle; background: var(--panel2); border: 1px solid var(--border); }
.tag.owner { background: #dc2626; color: #fff; border-color: #dc2626; }
.tag.admin { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.tag.photomod { background: #0891b2; color: #fff; border-color: #0891b2; }
.tag.ban { background: var(--danger); color: #fff; border-color: var(--danger); }
.tag.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.more { text-align: center; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.pcard img.ph { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--panel2); cursor: zoom-in; display: block; }
.pcard .body { padding: 10px 12px; flex: 1; }
.pcard .body p { margin: 0 0 3px; }
.pcard .acts { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
.thumb { width: 56px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; cursor: zoom-in; }
.form { padding: 16px; display: grid; gap: 10px; max-width: 640px; }

/* діалог, лайтбокс, тост */
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.dlg-box { width: 100%; max-width: 440px; background: var(--panel); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.dlg-box h3 { margin: 0 0 8px; }
.dlg-box p { margin: 0 0 12px; color: var(--muted); }
.dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; padding: 16px; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 70; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 340px; }
.toast.err { border-left-color: var(--danger); }

.chart { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding: 14px 16px 4px; }
.bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.bar:hover { opacity: 1; }
.chart-x { display: flex; gap: 4px; padding: 0 16px 12px; color: var(--muted); font-size: 11px; }
.chart-x span { flex: 1; text-align: center; }
.chart-total { float: right; font-weight: 400; color: var(--muted); }
.pcard { position: relative; }
.pick { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); border-radius: 8px; padding: 5px 7px; display: flex; }
.pick input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
.ucard { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px; z-index: 45; overflow-y: auto; }
.ucard-box { width: 100%; max-width: 720px; background: var(--panel); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.ucard-box h4 { margin: 18px 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.ucard-head { display: flex; gap: 14px; align-items: center; }
.ucard-head .avatar { width: 64px; height: 64px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs .thumb { width: 84px; height: 63px; }
.thumb.pending { outline: 2px solid var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); font-size: 13px; }
.cmt { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; overflow-wrap: anywhere; }
.cmt:last-child { border-bottom: none; }
@media (max-width: 860px) {
  #app { flex-direction: column; }
  #side { width: 100%; height: auto; position: static; flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; }
  #side h2 { display: none; }
  #side .grow { display: none; }
  #nav { display: flex; gap: 4px; }
  #side a.nav { white-space: nowrap; }
  .cols { grid-template-columns: 1fr; }
  #main { padding: 16px; }
  .row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>🛡️ Адмін-панель</h1>
    <p>Вхід для власника, адмінів і модераторів фото.</p>
    <input class="input" id="lgEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input class="input" id="lgPass" type="password" placeholder="Пароль" autocomplete="current-password" required>

    <button class="btn primary" id="lgBtn" type="submit" style="width:100%;justify-content:center">Увійти</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav id="side">
    <h2>🛡️ Адмін-панель</h2>
    <div id="nav"></div>
    <div class="grow"></div>
    <a class="nav" id="siteLink" href="#" target="_blank" rel="noopener">🌐 Відкрити сайт</a>
  </nav>
  <div id="content">
    <header id="top">
      <h1 id="pageTitle"></h1>
      <button class="btn small" id="themeBtn" type="button" title="Тема">🌓</button>

      <button class="btn small" id="logoutBtn" type="button">Вийти</button>
    </header>
    <main id="main"></main>

</div>

<div id="dlg" class="dlg hidden">
  <div class="dlg-box">
    <h3 id="dlgTitle"></h3>

    <textarea class="input hidden" id="dlgInput" rows="3"></textarea>

    <div class="dlg-btns">
      <button class="btn" id="dlgCancel" type="button">Скасувати</button>
      <button class="btn primary" id="dlgOk" type="button">Підтвердити</button>
    </div>
  </div>
</div>
<div id="ucard" class="ucard hidden"><div class="ucard-box" id="ucBody"></div></div>
<div id="lightbox" class="hidden"><img alt=""></div>
<div id="toasts"></div>

<script>
/* ============================ НАЛАШТУВАННЯ ============================ */
const SUPABASE_URL = 'https://fslbfqgzpsbkzbzamasa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Et7XDaX49e_J4RqfnoTpcA_e5yHEsS-';
const SITE_URL = 'https://gaimerctrl.github.io/transport/';   // адреса головного сайту
const DELETE_FUNCTION = 'smooth-handler';                      // Edge Function видалення акаунтів

/* ============================ ДОПОМІЖНЕ ============================ */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const RANK = { user: 0, photomod: 1, admin: 2, owner: 3 };
const ROLE_LABEL = { owner: 'OWNER', admin: 'ADMIN', photomod: 'PHOTOMOD', user: 'USER' };
const LOG_LABELS = {
  approve: 'прийняв місто', reject: 'відхилив місто', unpublish: 'зняв з публікації місто', delete: 'видалив місто',
  broadcast: 'надіслав оголошення', ban: 'заблокував акаунт', unban: 'розблокував акаунт',
  photo_approve: 'прийняв фото', photo_reject: 'відхилив фото', delete_account: 'видалив акаунт',
  set_role: 'змінив ранг акаунта', comment_delete: 'видалив коментар',
  report_dismiss: 'відхилив скаргу', report_resolve: 'закрив скаргу', maintenance: 'змінив режим техробіт',
  word_add: 'додав заборонене слово', word_del: 'видалив заборонене слово'
};
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#cfd3d8"/><circle cx="32" cy="24" r="11" fill="#9aa0a6"/><path d="M10 64c2-17 12-24 22-24s20 7 22 24z" fill="#9aa0a6"/></svg>');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const fmtDate = s => s ? new Date(s).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const escLike = s => String(s).replace(/[%_\\]/g, '\\$&');
const phUrl = p => db.storage.from('photos').getPublicUrl(p.path).data.publicUrl;
const userLink = (id, name) => el('a', { href: SITE_URL + '#user=' + id, target: '_blank', rel: 'noopener' }, name || '—');

function toast(msg, kind) {
  const t = el('div', { class: 'toast' + (kind === 'err' ? ' err' : '') }, msg);
  $('toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}

function openLightbox(src) {
  $('lightbox').firstElementChild.src = src;
  $('lightbox').classList.remove('hidden');
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.add('hidden'));

/* діалоги: повертають Promise */
let dlgDone = null;
function closeDlg(val) {
  $('dlg').classList.add('hidden');
  if (dlgDone) { const f = dlgDone; dlgDone = null; f(val); }
}
function dialog({ title, text, input, okLabel, danger, required }) {
  return new Promise(resolve => {
    $('dlgTitle').textContent = title;
    $('dlgText').textContent = text || '';
    $('dlgText').classList.toggle('hidden', !text);
    $('dlgInput').classList.toggle('hidden', !input);
    $('dlgInput').value = '';
    $('dlgInput').placeholder = input || '';
    $('dlgErr').textContent = '';
    $('dlgOk').textContent = okLabel || 'Підтвердити';
    $('dlgOk').className = 'btn ' + (danger ? 'danger' : 'primary');
    dlgDone = resolve;
    $('dlg').classList.remove('hidden');
    (input ? $('dlgInput') : $('dlgOk')).focus();
    $('dlgOk').onclick = () => {
      const v = $('dlgInput').value.trim();
      if (input && required && !v) { $('dlgErr').textContent = 'Заповніть це поле'; return; }
      closeDlg(input ? v : true);
    };
  });
}
$('dlgCancel').addEventListener('click', () => closeDlg(null));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('dlg').classList.contains('hidden')) closeDlg(null); $('lightbox').classList.add('hidden'); }
});
const askReason = (title, okLabel, danger = true) => dialog({ title, input: 'Причина', okLabel, danger, required: true });
const askConfirm = (title, text, okLabel, danger) => dialog({ title, text, okLabel, danger });

function downloadCsv(name, rows) {
  const cell = v => {
    let t = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;          // захист від формул у Excel
    return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function dailySeries(table, days) {
  const since = new Date();
  since.setHours(0, 0, 0, 0);
  since.setDate(since.getDate() - (days - 1));
  const { data } = await db.from(table).select('created_at').gte('created_at', since.toISOString()).limit(5000);
  const out = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(since); d.setDate(since.getDate() + i);
    out.push({ key: d.toDateString(), label: d.getDate(), title: d.toLocaleDateString('uk-UA'), n: 0 });
  }
  (data || []).forEach(r => { const k = new Date(r.created_at).toDateString(); const b = out.find(x => x.key === k); if (b) b.n++; });
  return out;
}
function chartPanel(title, series) {
  const max = Math.max(1, ...series.map(x => x.n));
  const total = series.reduce((a, x) => a + x.n, 0);
  return el('div', { class: 'panel' },
    el('h3', null, title, el('span', { class: 'chart-total' }, 'разом: ' + total)),
    el('div', { class: 'chart' }, ...series.map(x => el('div', { class: 'bar', title: x.title + ': ' + x.n, style: 'height:' + Math.round(x.n / max * 100) + '%' }))),
    el('div', { class: 'chart-x' }, ...series.map(x => el('span', null, x.label))));
}

/* запити */
async function count(table, filter) {
  let q = db.from(table).select('*', { count: 'exact', head: true });
  if (filter) q = filter(q);
  const { count: n, error } = await q;
  return error ? null : n;
}
async function usersMap(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  const map = {};
  for (let i = 0; i < uniq.length; i += 100) {
    const { data } = await db.from('profiles').select('id, username, avatar_url, role').in('id', uniq.slice(i, i + 100));
    (data || []).forEach(p => { map[p.id] = p; });
  }
  return map;
}
/* зміна/видалення з перевіркою, що запис справді змінився (RLS мовчки відсікає зайве) */
async function upd(table, patch, id) {
  const { data, error } = await db.from(table).update(patch).eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function del(table, id) {
  const { data, error } = await db.from(table).delete().eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function logAction(action, cityName, reason) {
  const { error } = await db.from('staff_log').insert({
    actor_id: me.id, actor_name: me.name || '', action, city_name: cityName || null, reason: reason || null
  });
  if (error) console.error(error);
}
async function notify(uid, message) {
  const { error } = await db.from('notifications').insert({ user_id: uid, message });
  if (error) toast('Сповіщення не надіслано: ' + error.message, 'err');
}

/* ============================ ВХІД / СЕАНС ============================ */
let me = null;
let notice = '';

function showLogin(msg) {
  me = null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('lgErr').textContent = msg || '';
  $('lgBtn').disabled = false;
}

async function enter(session) {
  if (!session) { showLogin(notice); return; }
  const { data: p } = await db.from('profiles').select('id, username, role, banned, avatar_url').eq('id', session.user.id).maybeSingle();
  if (!p || p.banned || !['owner', 'admin', 'photomod'].includes(p.role)) {
    notice = 'Доступ лише для власника, адмінів і модераторів фото.';
    await db.auth.signOut();
    showLogin(notice);
    return;
  }
  me = { id: p.id, name: p.username, role: p.role, avatar: p.avatar_url };
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('meName').textContent = me.name;
  $('meAvatar').src = me.avatar || PLACEHOLDER;
  $('meRole').textContent = ROLE_LABEL[me.role];
  $('meRole').className = 'tag ' + me.role;
  $('siteLink').href = SITE_URL;
  buildNav();
  route();
  refreshBadges();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  notice = '';
  $('lgBtn').disabled = true;
  $('lgErr').textContent = '';
  const { data, error } = await db.auth.signInWithPassword({ email: $('lgEmail').value.trim(), password: $('lgPass').value });
  if (error) {
    $('lgBtn').disabled = false;
    $('lgErr').textContent = /invalid/i.test(error.message) ? 'Невірна пошта або пароль' : error.message;
    return;
  }
  $('lgPass').value = '';
  await enter(data.session);
});
$('logoutBtn').addEventListener('click', async () => { notice = ''; await db.auth.signOut(); });
$('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('admin-theme', document.documentElement.dataset.theme); } catch (e) { /* ignore */ }
});
try { const t = localStorage.getItem('admin-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }

const PAGES = [
  { id: 'overview', ico: '📊', title: 'Огляд', min: 'admin', render: pgOverview },
  { id: 'users', ico: '👥', title: 'Акаунти', min: 'admin', render: pgUsers },
  { id: 'cities', ico: '🏙️', title: 'Міста', min: 'admin', render: pgCities, badge: 'cities' },
  { id: 'photos', ico: '📷', title: 'Фото', min: 'photomod', render: pgPhotos, badge: 'photos' },
  { id: 'comments', ico: '💬', title: 'Коментарі', min: 'photomod', render: pgComments },
  { id: 'reports', ico: '🚩', title: 'Скарги', min: 'photomod', render: pgReports, badge: 'reports' },
  { id: 'broadcast', ico: '📣', title: 'Оголошення', min: 'admin', render: pgBroadcast },
  { id: 'settings', ico: '⚙️', title: 'Налаштування', min: 'admin', render: pgSettings },
  { id: 'log', ico: '📜', title: 'Журнал', min: 'admin', render: pgLog }
];
const allowed = p => RANK[me.role] >= RANK[p.min];
let renderTok = 0;

function buildNav() {
  $('nav').replaceChildren(...PAGES.filter(allowed).map(p =>
    el('a', { class: 'nav', href: '#' + p.id, 'data-page': p.id }, el('span', null, p.ico), el('span', null, p.title),
      p.badge ? el('span', { class: 'nbadge hidden', id: 'nb-' + p.badge }) : null)));
}

function route() {
  if (!me) return;
  let id = location.hash.replace('#', '');
  let page = PAGES.find(p => p.id === id);
  if (!page || !allowed(page)) page = PAGES.find(allowed);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page.id));
  $('pageTitle').textContent = page.title;
  $('main').replaceChildren(el('div', { class: 'empty' }, 'Завантаження…'));
  const tok = ++renderTok;
  page.render(tok);
}
window.addEventListener('hashchange', route);

const stale = tok => tok !== renderTok;
function show(...nodes) { $('main').replaceChildren(...nodes.flat().filter(Boolean)); }

let lastCounts = null;
async function refreshBadges(announce) {
  const set = (id, n) => { const b = $(id); if (!b) return; b.textContent = n || ''; b.classList.toggle('hidden', !n); };
  const c = isAdmin() ? await count('cities', q => q.eq('submitted', true).eq('is_published', false)) : 0;
  const p = await count('photos', q => q.eq('status', 'pending'));
  const r = await count('reports', q => q.eq('status', 'open'));
  set('nb-cities', c); set('nb-photos', p); set('nb-reports', r);
  const total = (c || 0) + (p || 0) + (r || 0);
  document.title = (total ? '(' + total + ') ' : '') + 'Адмін-панель';
  if (announce && lastCounts) {
    if (p > lastCounts.p) toast('📷 Нових фото на модерації: ' + (p - lastCounts.p));
    if (c > lastCounts.c) toast('🏙️ Нових міст на модерації: ' + (c - lastCounts.c));
    if (r > lastCounts.r) toast('🚩 Нових скарг: ' + (r - lastCounts.r));
  }
  lastCounts = { c: c || 0, p: p || 0, r: r || 0 };
}
setInterval(() => { if (me && !document.hidden) refreshBadges(true); }, 45000);
document.addEventListener('visibilitychange', () => { if (me && !document.hidden) refreshBadges(true); });
const isOwner = () => me.role === 'owner';
const isAdmin = () => RANK[me.role] >= RANK.admin;

    count('profiles', q => q.eq('banned', true)),

    count('cities', q => q.eq('submitted', true).eq('is_published', false)),
    count('cities', q => q.eq('submitted', false).eq('is_published', false)),
    count('photos', q => q.eq('status', 'approved')),
    count('photos', q => q.eq('status', 'pending')),
    count('photo_comments')
  ]);

      el('p', { class: 'sub' }, fmtDate(x.created_at) + (x.reason ? ' · ' + x.reason : '')))));
  const usrRows = (usrRes.data || []).map(u => el('div', { class: 'row' },

    el('div', { class: 'info' }, el('p', null, userLink(u.id, u.username)), el('p', { class: 'sub' }, fmtDate(u.created_at)))));
  show(
    el('div', { class: 'cards' },
      stat(users, 'Користувачів'), stat(banned, 'Заблоковано'), stat(cPub, 'Міст опубліковано'),
      stat(cPend, 'Міст на модерації', true), stat(cDraft, 'Чернеток міст'), stat(phOk, 'Фото схвалено'),
      stat(phPend, 'Фото на модерації', true), stat(repOpen, 'Скарг відкрито', true), stat(cmts, 'Коментарів')),
    el('div', { class: 'cols' }, chartPanel('Нові користувачі, 14 днів', serU), chartPanel('Нові фото, 14 днів', serP)),
    el('div', { class: 'cols' },
      el('div', { class: 'panel' }, el('h3', null, 'Останні дії персоналу'), logRows.length ? logRows : el('div', { class: 'empty' }, 'Поки порожньо')),
      el('div', { class: 'panel' }, el('h3', null, 'Останні реєстрації'), usrRows.length ? usrRows : el('div', { class: 'empty' }, 'Поки порожньо'))));

/* ============================ АКАУНТИ ============================ */
const usersState = { q: '', role: 'all', limit: 50 };

function canManage(t) {
  if (t.id === me.id) return false;
  if (me.role === 'owner') return t.role !== 'owner';
  if (me.role === 'admin') return !['owner', 'admin'].includes(t.role);
  return false;
}

async function pgUsers(tok) {
  const st = usersState;
  let q = db.from('profiles').select('*').order('created_at', { ascending: false }).limit(st.limit);
  if (st.q) q = q.ilike('username', '%' + escLike(st.q) + '%');
  if (st.role === 'banned') q = q.eq('banned', true);
  else if (st.role !== 'all') q = q.eq('role', st.role);
  const { data, error } = await q;
  if (stale(tok)) return;
  const rows = (data || []).map(userRow);
  const search = el('input', { class: 'input', placeholder: 'Пошук за ніком…', value: st.q });
  let timer = null;
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = search.value.trim(); st.limit = 50; pgUsers(++renderTok); }, 350); });
  const roleSel = el('select', { class: 'input', style: 'max-width:200px' },
    ...[['all', 'Усі'], ['owner', 'Власник'], ['admin', 'Адміни'], ['photomod', 'Фотомодератори'], ['user', 'Користувачі'], ['banned', 'Заблоковані']]
      .map(([v, l]) => el('option', { value: v, selected: st.role === v }, l)));
  roleSel.addEventListener('change', () => { st.role = roleSel.value; st.limit = 50; pgUsers(++renderTok); });
  show(
    el('div', { class: 'toolbar' }, search, roleSel,
      el('button', { class: 'btn', onclick: () => downloadCsv('users.csv', [['id', 'нік', 'ранг', 'заблоковано', 'причина бану', 'реєстрація']]
        .concat((data || []).map(u => [u.id, u.username, u.role, u.banned ? 'так' : 'ні', u.ban_reason || '', u.created_at]))) }, '⬇️ CSV')),
    el('div', { class: 'panel' },
      error ? el('div', { class: 'empty' }, error.message) : rows.length ? rows : el('div', { class: 'empty' }, 'Нікого не знайдено'),
      rows.length >= st.limit ? el('div', { class: 'more' }, el('button', { class: 'btn', onclick: () => { st.limit += 50; pgUsers(++renderTok); } }, 'Показати ще')) : null));
}

function userRow(u) {
  const acts = el('div', { class: 'acts' });
  if (canManage(u)) {
    const roles = me.role === 'owner' ? ['user', 'photomod', 'admin'] : ['user', 'photomod'];
    const sel = el('select', { class: 'input', style: 'width:auto;padding:5px 8px', title: 'Ранг' },
      ...roles.map(r => el('option', { value: r, selected: u.role === r }, ROLE_LABEL[r])));
    if (!roles.includes(u.role)) sel.prepend(el('option', { value: u.role, selected: true }, ROLE_LABEL[u.role]));
    sel.addEventListener('change', () => setRole(u, sel.value, sel));
    acts.append(sel,
      el('button', { class: 'btn small' + (u.banned ? ' ok' : ''), onclick: () => toggleBan(u) }, u.banned ? 'Розблокувати' : 'Заблокувати'),
      el('button', { class: 'btn small danger', onclick: () => deleteAccount(u) }, 'Видалити'));
  }
  acts.append(el('button', { class: 'btn small', onclick: () => openUserCard(u) }, 'Картка'));
  return el('div', { class: 'row' + (u.banned ? ' banned' : '') },
    el('img', { class: 'avatar', src: u.avatar_url || PLACEHOLDER, alt: '' }),
    el('div', { class: 'info' },
      el('p', null, userLink(u.id, u.username),
        ['owner', 'admin', 'photomod'].includes(u.role) ? el('span', { class: 'tag ' + u.role }, ROLE_LABEL[u.role]) : null,
        u.banned ? el('span', { class: 'tag ban' }, 'БАН') : null),
      el('p', { class: 'sub' }, 'Реєстрація: ' + fmtDate(u.created_at) + (u.banned && u.ban_reason ? ' · Причина бану: ' + u.ban_reason : ''))),
    acts);
}

async function setRole(u, role, sel) {
  if (role === u.role) return;
  const label = { user: 'Користувач', photomod: 'Photomod', admin: 'Admin' }[role];
  const ok = await askConfirm('Змінити ранг', 'Акаунт «' + u.username + '» отримає ранг: ' + label + '.', 'Змінити', false);
  if (!ok) { sel.value = u.role; return; }
  const { error } = await db.rpc('set_role', { target: u.id, new_role: role });
  if (error) { toast(error.message, 'err'); sel.value = u.role; return; }
  await logAction('set_role', u.username, label);
  await notify(u.id, 'Ваш ранг змінено: ' + label);
  toast('Ранг змінено');
  pgUsers(++renderTok);
}

async function toggleBan(u) {
  let reason = null;
  if (!u.banned) {
    reason = await askReason('Причина бану: ' + u.username, 'Заблокувати');
    if (reason == null) return;
  } else if (!(await askConfirm('Розблокувати «' + u.username + '»?', '', 'Розблокувати', false))) return;
  const { error } = await db.rpc('set_ban', { target: u.id, ban: !u.banned, reason });
  if (error) { toast(error.message, 'err'); return; }
  await logAction(u.banned ? 'unban' : 'ban', u.username, reason);
  toast(u.banned ? 'Розблоковано' : 'Заблоковано');
  pgUsers(++renderTok);
}

async function deleteAccount(u) {
  const reason = await askReason('Видалити «' + u.username + '» (причина піде на пошту)', 'Видалити акаунт');
  if (reason == null) return;
  const { data, error } = await db.functions.invoke(DELETE_FUNCTION, { body: { target: u.id, reason } });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) { /* ignore */ }
    toast(m, 'err');
    return;
  }
  if (data && data.error) { toast(data.error, 'err'); return; }
  await logAction('delete_account', u.username, reason);
  toast(data && data.mail_error ? 'Акаунт видалено, але лист не надіслано: ' + data.mail_error : 'Акаунт видалено', data && data.mail_error ? 'err' : '');
  pgUsers(++renderTok);
}

async function openUserCard(u) {
  const box = $('ucBody');
  box.replaceChildren(el('div', { class: 'empty' }, 'Завантаження…'));
  $('ucard').classList.remove('hidden');
  const [st, ph, cm, ct, full] = await Promise.all([
    db.rpc('profile_stats', { p_uid: u.id }),
    db.from('photos').select('*').eq('owner_id', u.id).order('created_at', { ascending: false }).limit(12),
    db.from('photo_comments').select('*').eq('owner_id', u.id).order('created_at', { ascending: false }).limit(6),
    db.from('cities').select('id, name, is_published, submitted').eq('owner_id', u.id).order('created_at', { ascending: false }).limit(20),
    db.from('profiles').select('*').eq('id', u.id).maybeSingle()
  ]);
  if ($('ucard').classList.contains('hidden')) return;
  const p = full.data || u;
  const photos = ph.data || [], comments = cm.data || [], cities = ct.data || [];
  let s = st.data;
  if (!s || st.error) s = {
    photos: photos.filter(x => x.status === 'approved').length, views: photos.reduce((a, x) => a + (x.views || 0), 0),
    likes: null, dislikes: null, comments: comments.length, cities: cities.filter(c => c.is_published).length
  };
  const rating = s.likes == null ? '—' : ((s.likes - s.dislikes) > 0 ? '+' : '') + (s.likes - s.dislikes);
  const stat = (label, v) => el('div', { class: 'stat' }, el('b', null, v), el('span', null, label));
  const acts = el('div', { class: 'acts', style: 'justify-content:flex-start;margin-top:18px' },
    el('a', { class: 'btn', href: SITE_URL + '#user=' + u.id, target: '_blank', rel: 'noopener' }, '🌐 Профіль на сайті'));
  if (canManage(p)) acts.append(
    el('button', { class: 'btn' + (p.banned ? ' ok' : ''), onclick: () => { $('ucard').classList.add('hidden'); toggleBan(p); } }, p.banned ? 'Розблокувати' : 'Заблокувати'),
    el('button', { class: 'btn danger', onclick: () => { $('ucard').classList.add('hidden'); deleteAccount(p); } }, 'Видалити акаунт'));
  acts.append(el('button', { class: 'btn', onclick: () => $('ucard').classList.add('hidden') }, 'Закрити'));
  box.replaceChildren(...[
    el('div', { class: 'ucard-head' },
      el('img', { class: 'avatar', src: p.avatar_url || PLACEHOLDER, alt: '' }),
      el('div', null,
        el('h3', { style: 'margin:0' }, p.username,
          ['owner', 'admin', 'photomod'].includes(p.role) ? el('span', { class: 'tag ' + p.role }, ROLE_LABEL[p.role]) : null,
          p.banned ? el('span', { class: 'tag ban' }, 'БАН') : null),
        el('div', { class: 'sub' }, 'Реєстрація: ' + fmtDate(p.created_at) + (p.location ? ' · 📍 ' + p.location : '')),
        p.banned && p.ban_reason ? el('div', { class: 'sub' }, 'Причина бану: ' + p.ban_reason) : null)),
    p.bio ? el('p', { style: 'white-space:pre-wrap;overflow-wrap:anywhere' }, p.bio) : null,
    p.contacts ? el('div', { class: 'sub' }, '✉️ ' + p.contacts) : null,
    el('div', { class: 'cards', style: 'margin-top:14px' },
      stat('Фото', s.photos), stat('Перегляди', s.views), stat('Рейтинг', rating), stat('Коментарі', s.comments), stat('Міста', s.cities)),
    el('h4', null, 'Останні фото'),
    photos.length ? el('div', { class: 'thumbs' }, ...photos.map(x => el('img', {
      class: 'thumb' + (x.status === 'pending' ? ' pending' : ''), src: phUrl(x), loading: 'lazy', alt: '',
      title: (x.status === 'pending' ? 'На модерації · ' : '') + (x.city_name || ''), onclick: () => openLightbox(phUrl(x))
    }))) : el('div', { class: 'sub' }, 'Фото немає'),
    el('h4', null, 'Останні коментарі'),
    comments.length ? comments.map(c => el('div', { class: 'cmt' }, el('span', { class: 'sub' }, fmtDate(c.created_at) + ' · '), c.body)) : el('div', { class: 'sub' }, 'Коментарів немає'),
    el('h4', null, 'Міста'),
    cities.length ? el('div', { class: 'chips' }, ...cities.map(c => el('span', { class: 'chip' }, c.name + (c.is_published ? '' : c.submitted ? ' (на модерації)' : ' (чернетка)')))) : el('div', { class: 'sub' }, 'Міст немає'),
    acts].flat().filter(Boolean));
}

/* ============================ МІСТА ============================ */
const citiesState = { tab: 'pending', q: '' };
const CITY_TABS = [
  ['pending', 'На модерації', q => q.eq('submitted', true).eq('is_published', false)],
  ['published', 'Опубліковані', q => q.eq('is_published', true)],
  ['drafts', 'Чернетки', q => q.eq('submitted', false).eq('is_published', false)]
];

async function pgCities(tok) {
  const st = citiesState;
  const tabDef = CITY_TABS.find(t => t[0] === st.tab);
  const [counts, res] = await Promise.all([
    Promise.all(CITY_TABS.map(t => count('cities', t[2]))),
    tabDef[2](db.from('cities').select('*')).order('created_at', { ascending: false }).limit(300)
  ]);
  const authors = await usersMap((res.data || []).map(c => c.owner_id));
  if (stale(tok)) return;
  const q = st.q.toLowerCase();
  const list = (res.data || []).filter(c => !q ||
    [c.name, c.country, c.region, (authors[c.owner_id] || {}).username].some(v => String(v || '').toLowerCase().includes(q)));
  const tabs = el('div', { class: 'tabs' }, ...CITY_TABS.map((t, i) =>
    el('button', { class: 'tab' + (st.tab === t[0] ? ' active' : ''), onclick: () => { st.tab = t[0]; pgCities(++renderTok); } },
      t[1] + (counts[i] != null ? ' (' + counts[i] + ')' : ''))));
  const search = el('input', { class: 'input', placeholder: 'Пошук за містом, країною, автором…', value: st.q });
  search.addEventListener('input', () => { st.q = search.value.trim(); clearTimeout(search._t); search._t = setTimeout(() => pgCities(++renderTok), 350); });
  show(tabs, el('div', { class: 'toolbar' }, search),
    el('div', { class: 'panel' }, res.error ? el('div', { class: 'empty' }, res.error.message) :
      list.length ? list.map(c => cityRow(c, authors[c.owner_id])) : el('div', { class: 'empty' }, 'Тут порожньо')));
}

function cityRow(c, author) {
  const acts = el('div', { class: 'acts' });
  if (isOwner()) {
    if (c.is_published) acts.append(el('button', { class: 'btn small', onclick: () => cityUnpublish(c) }, 'Зняти з публікації'));
    else {
      acts.append(el('button', { class: 'btn small ok', onclick: () => cityApprove(c) }, c.submitted ? 'Прийняти' : 'Опублікувати'));
      if (c.submitted) acts.append(el('button', { class: 'btn small', onclick: () => cityReject(c) }, 'Відхилити'));
    }
  }
  if (isAdmin()) acts.append(el('button', { class: 'btn small danger', onclick: () => cityDelete(c) }, 'Видалити'));
  return el('div', { class: 'row' },
    el('div', { class: 'info' },
      el('p', null, el('b', null, c.name), ' ', el('span', { class: 'sub' }, [c.region, c.country].filter(Boolean).join(', ')),
        c.is_published ? el('span', { class: 'tag ok' }, 'ОПУБЛІКОВАНО') : null),
      el('p', { class: 'sub' }, 'Автор: ', author ? userLink(author.id, author.username) : '—',

const photosState = { tab: 'pending', limit: 48, sel: new Set() };

async function pgPhotos(tok) {
  const st = photosState;
  const [cPend, cOk, res] = await Promise.all([
    count('photos', q => q.eq('status', 'pending')),
    count('photos', q => q.eq('status', 'approved')),
    db.from('photos').select('*').eq('status', st.tab).order('created_at', { ascending: st.tab === 'pending' }).limit(st.limit)
  ]);
  const authors = await usersMap((res.data || []).map(p => p.owner_id));
  if (stale(tok)) return;
  const tabs = el('div', { class: 'tabs' },
    el('button', { class: 'tab' + (st.tab === 'pending' ? ' active' : ''), onclick: () => { st.tab = 'pending'; st.limit = 48; pgPhotos(++renderTok); } }, 'На модерації' + (cPend != null ? ' (' + cPend + ')' : '')),
    el('button', { class: 'tab' + (st.tab === 'approved' ? ' active' : ''), onclick: () => { st.tab = 'approved'; st.limit = 48; pgPhotos(++renderTok); } }, 'Схвалені' + (cOk != null ? ' (' + cOk + ')' : '')));
  const items = res.data || [];
  st.sel = new Set([...st.sel].filter(id => items.some(p => p.id === id)));
  const bulkBtn = el('button', { class: 'btn ok hidden', type: 'button' });
  const refreshBulk = () => { bulkBtn.textContent = '✔ Схвалити вибрані (' + st.sel.size + ')'; bulkBtn.classList.toggle('hidden', !st.sel.size); };
  bulkBtn.addEventListener('click', () => bulkApprove(items.filter(p => st.sel.has(p.id))));
  const cards = items.map(p => {
    const url = phUrl(p);
    const a = authors[p.owner_id];
    const acts = el('div', { class: 'acts' });
    if (p.status === 'pending') acts.append(
      el('button', { class: 'btn small ok', onclick: () => photoApprove(p) }, 'Схвалити'),
      el('button', { class: 'btn small danger', onclick: () => photoReject(p, 'Причина відмови', 'Відхилити') }, 'Відхилити'));
    else acts.append(el('button', { class: 'btn small danger', onclick: () => photoReject(p, 'Причина видалення', 'Видалити') }, 'Видалити'));
    const pick = p.status === 'pending' ? el('label', { class: 'pick', title: 'Вибрати' },
      el('input', { type: 'checkbox', checked: st.sel.has(p.id), onchange: e => { e.target.checked ? st.sel.add(p.id) : st.sel.delete(p.id); refreshBulk(); } })) : null;
    return el('div', { class: 'pcard' }, pick,
      el('img', { class: 'ph', src: url, loading: 'lazy', alt: '', onclick: () => openLightbox(url) }),
      el('div', { class: 'body' },
        el('p', null, el('b', null, (p.city_name || '—') + ' · ' + (p.enterprise_name || '—'))),
        el('p', { class: 'sub' }, [p.fleet_no && 'Борт ' + p.fleet_no, p.model, p.plate_no].filter(Boolean).join(' · ') || '—'),
        el('p', { class: 'sub' }, 'Автор: ', a ? userLink(a.id, a.username) : (p.owner_name || '—'), ' · ' + fmtDate(p.created_at) + ' · 👁 ' + (p.views || 0))),
      acts);
  });
  const selectAll = st.tab === 'pending' && items.length ? el('button', { class: 'btn', type: 'button', onclick: () => {
    const all = st.sel.size === items.length;
    st.sel = new Set(all ? [] : items.map(p => p.id));
    document.querySelectorAll('.pick input').forEach(i => { i.checked = !all; });
    refreshBulk();
  } }, 'Вибрати всі / зняти') : null;
  refreshBulk();
  show(tabs, selectAll ? el('div', { class: 'toolbar' }, selectAll, bulkBtn) : null, res.error ? el('div', { class: 'empty' }, res.error.message) :
    cards.length ? el('div', { class: 'grid' }, ...cards) : el('div', { class: 'panel' }, el('div', { class: 'empty' }, 'Тут порожньо')),
    cards.length >= st.limit ? el('div', { class: 'more' }, el('button', { class: 'btn', onclick: () => { st.limit += 48; pgPhotos(++renderTok); } }, 'Показати ще')) : null);
}

async function photoApprove(p) {
  const err = await upd('photos', { status: 'approved' }, p.id);
  if (err) { toast(err, 'err'); return; }
  await logAction('photo_approve', p.city_name, p.enterprise_name);
  await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» прийнято і опубліковано');

async function bulkApprove(list) {
  if (!list.length) return;
  if (!(await askConfirm('Схвалити ' + list.length + ' фото?', 'Автори отримають сповіщення про публікацію.', 'Схвалити', false))) return;
  let ok = 0, fail = '';
  for (const p of list) {
    const err = await upd('photos', { status: 'approved' }, p.id);
    if (err) { fail = err; continue; }
    ok++;
    await logAction('photo_approve', p.city_name, p.enterprise_name);
    await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» прийнято і опубліковано');
  }
  photosState.sel.clear();
  toast('Схвалено: ' + ok + (fail ? ' · помилки: ' + fail : ''), fail ? 'err' : '');
  refreshBadges(); pgPhotos(++renderTok);
}
async function photoReject(p, title, okLabel) {

/* ============================ СКАРГИ ============================ */
const reportsState = { tab: 'open' };
const REASONS = { spam: 'Спам', inappropriate: 'Неприйнятний вміст', copyright: 'Авторські права', other: 'Інше' };

async function pgReports(tok) {
  const st = reportsState;
  const base = db.from('reports').select('*');
  const [cOpen, res] = await Promise.all([
    count('reports', q => q.eq('status', 'open')),
    (st.tab === 'open' ? base.eq('status', 'open') : base.neq('status', 'open'))
      .order('created_at', { ascending: st.tab === 'open' }).limit(200)
  ]);
  const groups = new Map();
  (res.data || []).forEach(r => {
    const k = r.target_type + ':' + r.target_id;
    if (!groups.has(k)) groups.set(k, { type: r.target_type, id: r.target_id, reports: [] });
    groups.get(k).reports.push(r);
  });
  const list = [...groups.values()];
  const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };
  const photos = {}, comments = {};
  for (const part of chunk(list.filter(g => g.type === 'photo').map(g => g.id), 100)) {
    const r = await db.from('photos').select('id, owner_id, owner_name, city_name, enterprise_name, path, status').in('id', part);
    (r.data || []).forEach(x => { photos[x.id] = x; });
  }
  for (const part of chunk(list.filter(g => g.type === 'comment').map(g => g.id), 100)) {
    const r = await db.from('photo_comments').select('id, owner_id, owner_name, body, photo_id').in('id', part);
    (r.data || []).forEach(x => { comments[x.id] = x; });
  }
  const reporters = await usersMap((res.data || []).map(r => r.reporter_id));
  if (stale(tok)) return;

  const tabs = el('div', { class: 'tabs' },
    el('button', { class: 'tab' + (st.tab === 'open' ? ' active' : ''), onclick: () => { st.tab = 'open'; pgReports(++renderTok); } }, 'Відкриті' + (cOpen != null ? ' (' + cOpen + ')' : '')),
    el('button', { class: 'tab' + (st.tab === 'closed' ? ' active' : ''), onclick: () => { st.tab = 'closed'; pgReports(++renderTok); } }, 'Розглянуті'));

  const rows = list.map(g => {
    const target = g.type === 'photo' ? photos[g.id] : comments[g.id];
    const counts = {};
    g.reports.forEach(r => { counts[r.reason] = (counts[r.reason] || 0) + 1; });
    const summary = Object.entries(counts).map(([k, n]) => (REASONS[k] || k) + (n > 1 ? ' ×' + n : '')).join(', ');
    const url = g.type === 'photo' && target ? phUrl(target) : null;
    const who = target ? el('p', { class: 'sub' }, 'Автор: ', userLink(target.owner_id, target.owner_name)) : null;
    const body = target
      ? (g.type === 'photo'
        ? el('p', null, el('b', null, '📷 ' + (target.city_name || '—') + ' · ' + (target.enterprise_name || '—')))
        : el('p', { style: 'white-space:pre-wrap;overflow-wrap:anywhere' }, el('b', null, '💬 '), target.body))
      : el('p', { class: 'sub' }, 'Контент уже видалено');
    const details = g.reports.slice(0, 4).map(r => el('p', { class: 'sub' },
      '• ', (reporters[r.reporter_id] || {}).username || '—', ': ', REASONS[r.reason] || r.reason, r.details ? ' — ' + r.details : '',
      r.status !== 'open' ? ' [' + (r.status === 'resolved' ? 'розглянуто' : 'відхилено') + ']' : ''));
    const acts = el('div', { class: 'acts' });
    if (st.tab === 'open') {
      if (target) acts.append(el('button', { class: 'btn small danger', onclick: () => reportDeleteTarget(g, target) }, 'Видалити контент'));
      acts.append(
        el('button', { class: 'btn small', onclick: () => reportClose(g, 'dismissed') }, 'Відхилити скаргу'),
        el('button', { class: 'btn small ok', onclick: () => reportClose(g, 'resolved') }, 'Розглянуто'));
    }
    return el('div', { class: 'row', style: 'align-items:flex-start' },
      url ? el('img', { class: 'thumb', style: 'width:96px;height:72px', src: url, loading: 'lazy', alt: '', onclick: () => openLightbox(url) }) : null,
      el('div', { class: 'info' }, body, who,
        el('p', { class: 'sub' }, el('span', { class: 'tag ban' }, g.reports.length + ' скарг'), ' ' + summary + ' · ' + fmtDate(g.reports[0].created_at)),
        ...details),
      acts);
  });
  show(tabs, el('div', { class: 'panel' }, res.error ? el('div', { class: 'empty' }, res.error.message) : rows.length ? rows : el('div', { class: 'empty' }, 'Скарг немає 🎉')));
}

async function closeReports(g, status) {
  const { error } = await db.from('reports').update({ status, resolved_by: me.id, resolved_at: new Date().toISOString() })
    .eq('target_type', g.type).eq('target_id', g.id).eq('status', 'open').select('id');
  return error ? error.message : '';
}
async function reportClose(g, status) {
  const err = await closeReports(g, status);
  if (err) { toast(err, 'err'); return; }
  await logAction(status === 'dismissed' ? 'report_dismiss' : 'report_resolve', null, (g.type === 'photo' ? 'фото ' : 'коментар ') + g.id.slice(0, 8));
  toast(status === 'dismissed' ? 'Скаргу відхилено' : 'Скаргу закрито');
  refreshBadges(); pgReports(++renderTok);
}
async function reportDeleteTarget(g, t) {
  const reason = await askReason('Причина видалення', 'Видалити контент');
  if (reason == null) return;
  let err;
  if (g.type === 'photo') {
    err = await del('photos', t.id);
    if (!err) {
      try { await db.storage.from('photos').remove([t.path]); } catch (e) { /* ignore */ }
      await logAction('photo_reject', t.city_name, 'скарга: ' + reason);
      await notify(t.owner_id, 'Ваше фото (' + (t.enterprise_name || '') + ') у місті «' + (t.city_name || '') + '» видалено за скаргою. Причина: ' + reason);
    }
  } else {
    err = await del('photo_comments', t.id);
    if (!err) {
      await logAction('comment_delete', null, (t.owner_name || '') + ': ' + String(t.body).slice(0, 100) + ' (скарга: ' + reason + ')');
      await notify(t.owner_id, 'Ваш коментар видалено за скаргою. Причина: ' + reason);
    }
  }
  if (err) { toast(err, 'err'); return; }
  const e2 = await closeReports(g, 'resolved');
  if (e2) toast(e2, 'err');
  toast('Контент видалено, скаргу закрито');
  refreshBadges(); pgReports(++renderTok);
}

/* ============================ НАЛАШТУВАННЯ ============================ */
async function pgSettings(tok) {
  const [setRes, wordsRes] = await Promise.all([
    db.from('site_settings').select('value').eq('key', 'maintenance').maybeSingle(),
    db.from('banned_words').select('*').order('word')
  ]);
  if (stale(tok)) return;
  const cur = (setRes.data && setRes.data.value) || { on: false, message: '' };

  /* режим техробіт: змінює лише власник */
  const on = el('input', { type: 'checkbox', checked: !!cur.on, disabled: !isOwner() });
  const msg = el('textarea', { class: 'input', rows: 3, placeholder: 'Текст для відвідувачів (необов’язково)', disabled: !isOwner() });
  msg.value = cur.message || '';
  const note = el('div', { class: 'err' });
  const save = el('button', { class: 'btn primary', type: 'button', disabled: !isOwner() }, 'Зберегти');
  save.addEventListener('click', async () => {
    save.disabled = true; note.style.color = '';
    const value = { on: on.checked, message: msg.value.trim() };
    const { error } = await db.from('site_settings').upsert({ key: 'maintenance', value, updated_at: new Date().toISOString() });
    save.disabled = false;
    if (error) { note.textContent = error.message; return; }
    await logAction('maintenance', null, value.on ? 'увімкнено' + (value.message ? ': ' + value.message : '') : 'вимкнено');
    note.style.color = 'var(--ok)'; note.textContent = value.on ? 'Режим техробіт УВІМКНЕНО' : 'Режим техробіт вимкнено';
  });

  /* заборонені слова */
  const wordInput = el('input', { class: 'input', placeholder: 'Нове слово або фраза', maxlength: 40, style: 'max-width:260px' });
  const wordNote = el('div', { class: 'err' });
  const chips = el('div', { class: 'chips', style: 'padding:0 16px 16px' });
  const drawWords = words => {
    chips.replaceChildren(...(words.length ? words.map(w => el('span', { class: 'chip' }, w.word, ' ',
      el('a', { href: '#settings', title: 'Видалити', onclick: async e => {
        e.preventDefault();
        const { error } = await db.from('banned_words').delete().eq('word', w.word);
        if (error) { toast(error.message, 'err'); return; }
        await logAction('word_del', null, w.word);
        words = words.filter(x => x.word !== w.word); drawWords(words);
      } }, '✕'))) : [el('span', { class: 'sub' }, 'Список порожній')]));
    chips._words = words;
  };
  drawWords(wordsRes.data || []);
  const addWord = el('button', { class: 'btn', type: 'button' }, 'Додати');
  addWord.addEventListener('click', async () => {
    const w = wordInput.value.trim().toLowerCase();
    wordNote.style.color = '';
    if (w.length < 2) { wordNote.textContent = 'Мінімум 2 символи'; return; }
    const { error } = await db.from('banned_words').insert({ word: w });
    if (error) { wordNote.textContent = /duplicate|unique/i.test(error.message) ? 'Таке слово вже є' : error.message; return; }
    await logAction('word_add', null, w);
    wordInput.value = ''; wordNote.textContent = '';
    drawWords([...(chips._words || []), { word: w }].sort((a, b) => a.word.localeCompare(b.word)));
  });

  show(
    el('div', { class: 'panel' }, el('h3', null, '🛠️ Режим технічних робіт'),
      el('div', { class: 'form' },
        el('label', { style: 'display:flex;gap:8px;align-items:center' }, on, 'Увімкнути (звичайні користувачі побачать заставку; персонал працює як зазвичай)'),
        msg, note, isOwner() ? el('div', null, save) : el('div', { class: 'sub' }, 'Змінювати може лише власник'))),
    el('div', { class: 'panel' }, el('h3', null, '🚫 Заборонені слова в коментарях'),
      el('div', { class: 'form' },
        el('div', { class: 'sub' }, 'Коментар із таким словом (як частиною тексту, без урахування регістру) не буде опубліковано. Персонал не обмежується.'),
        el('div', { class: 'toolbar', style: 'margin:0' }, wordInput, addWord), wordNote),
      wordsRes.error ? el('div', { class: 'empty' }, wordsRes.error.message) : chips));
}

async function pgBroadcast(tok) {

  const msg = el('div', { class: 'err' });

  const text2 = el('textarea', { class: 'input', rows: 3, placeholder: 'Особисте повідомлення' });
  const msg2 = el('div', { class: 'err' });
  const sendOne = el('button', { class: 'btn primary', type: 'button' }, 'Надіслати користувачу');

  sendAll.addEventListener('click', async () => {
    const t = text.value.trim();
    if (!t) { msg.style.color = ''; msg.textContent = 'Введіть текст'; return; }
    if (!(await askConfirm('Надіслати всім?', 'Оголошення отримають усі користувачі сайту.', 'Надіслати', false))) return;
    sendAll.disabled = true; msg.textContent = '';
    const ids = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await db.from('profiles').select('id').order('created_at').range(from, from + 999);
      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
      ids.push(...data.map(p => p.id));
      if (data.length < 1000) break;
    }
    for (let i = 0; i < ids.length; i += 500) {
      const { error } = await db.from('notifications').insert(ids.slice(i, i + 500).map(id => ({ user_id: id, message: 'Оголошення: ' + t })));
      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
    }
    await logAction('broadcast', null, t);
    text.value = ''; sendAll.disabled = false;
    msg.style.color = 'var(--ok)'; msg.textContent = 'Надіслано користувачам: ' + ids.length;
  });

  sendOne.addEventListener('click', async () => {
    const n = nick.value.trim(), t = text2.value.trim();
    msg2.style.color = '';
    if (!n || !t) { msg2.textContent = 'Вкажіть нік і текст'; return; }
    const { data } = await db.from('profiles').select('id, username').ilike('username', escLike(n)).maybeSingle();
    if (!data) { msg2.textContent = 'Користувача не знайдено'; return; }
    const { error } = await db.from('notifications').insert({ user_id: data.id, message: t });
    if (error) { msg2.textContent = error.message; return; }
    text2.value = ''; msg2.style.color = 'var(--ok)'; msg2.textContent = 'Надіслано: ' + data.username;
  });

  if (stale(tok)) return;
  show(
    el('div', { class: 'panel' }, el('h3', null, '📣 Оголошення всім'), el('div', { class: 'form' }, text, msg, el('div', null, sendAll))),
    el('div', { class: 'panel' }, el('h3', null, '✉️ Повідомлення одному користувачу'), el('div', { class: 'form' }, nick, text2, msg2, el('div', null, sendOne))));
}

/* ============================ ЖУРНАЛ ============================ */
const logState = { action: 'all', q: '' };

async function pgLog(tok) {
  const st = logState;
  let q = db.from('staff_log').select('*').order('created_at', { ascending: false }).limit(300);
  if (st.action !== 'all') q = q.eq('action', st.action);
  const { data, error } = await q;
  if (stale(tok)) return;
  const f = st.q.toLowerCase();
  const list = (data || []).filter(x => !f || [x.actor_name, x.city_name, x.reason, LOG_LABELS[x.action]].some(v => String(v || '').toLowerCase().includes(f)));
  const sel = el('select', { class: 'input', style: 'max-width:240px' },
    el('option', { value: 'all' }, 'Усі дії'),
    ...Object.entries(LOG_LABELS).map(([k, l]) => el('option', { value: k, selected: st.action === k }, l)));
  sel.addEventListener('change', () => { st.action = sel.value; pgLog(++renderTok); });
  const search = el('input', { class: 'input', placeholder: 'Пошук…', value: st.q });
  search.addEventListener('input', () => { st.q = search.value.trim(); clearTimeout(search._t); search._t = setTimeout(() => pgLog(++renderTok), 300); });
  const csvBtn = el('button', { class: 'btn', onclick: () => downloadCsv('log.csv', [['дата', 'хто', 'дія', 'об’єкт', 'причина/текст']]
    .concat(list.map(x => [x.created_at, x.actor_name, LOG_LABELS[x.action] || x.action, x.city_name, x.reason])) ) }, '⬇️ CSV');
  show(el('div', { class: 'toolbar' }, sel, search, csvBtn),
    el('div', { class: 'panel' }, error ? el('div', { class: 'empty' }, error.message) : list.length ? list.map(x =>
      el('div', { class: 'row' }, el('div', { class: 'info' },
        el('p', null, el('b', null, x.actor_name || 'Невідомий'), ' ' + (LOG_LABELS[x.action] || x.action) + (x.city_name ? ' «' + x.city_name + '»' : '')),
        x.reason ? el('p', null, (x.action === 'broadcast' ? 'Текст: ' : 'Причина: ') + x.reason) : null,
        el('p', { class: 'sub' }, fmtDate(x.created_at))))) : el('div', { class: 'empty' }, 'Записів немає')));
}

/* ============================ СТАРТ ============================ */
(async function boot() {
  const { data } = await db.auth.getSession();
  await enter(data.session);
  db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') enter(null); });
})();
