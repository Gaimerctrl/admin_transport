<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмін-панель</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f8f9fa; --text: #1c1f23; --muted: #6b7280;
  --border: #e3e5e8; --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
    --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #1b1e24; --panel2: #22262d; --text: #e8eaed; --muted: #9aa0a6;
  --border: #2d323a; --accent: #5b8def; --accent-text: #0b1020; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* кнопки та поля */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; }
.btn:hover { filter: brightness(.96); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; min-height: 90px; }

/* вхід */
#login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.login-card .input { margin-bottom: 10px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0; }

/* каркас */
#app { display: flex; min-height: 100%; }
#side { width: 230px; flex: none; background: var(--panel); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
#side h2 { margin: 0 8px 14px; font-size: 17px; }
#side a.nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text); text-decoration: none; }
#side a.nav:hover { background: var(--panel2); }
#side a.nav.active { background: var(--accent); color: var(--accent-text); }
#side .grow { flex: 1; }
.nbadge { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
#side a.nav.active .nbadge { background: #fff; color: var(--danger); }
#content { flex: 1; min-width: 0; }
#top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
#top h1 { margin: 0; font-size: 20px; flex: 1; }
.me { display: flex; align-items: center; gap: 8px; }
#main { padding: 22px 24px 60px; max-width: 1200px; }

/* компоненти */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.warn b { color: var(--warn); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.panel > h3 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--border); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar .input { max-width: 280px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; }
.tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row.banned { background: rgba(220,38,38,.07); }
.row .info { flex: 1; min-width: 0; }
.row .info p { margin: 0; }
.row .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--panel2); flex: none; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .3px; margin-left: 6px; vertical-align: middle; background: var(--panel2); border: 1px solid var(--border); }
.tag.owner { background: #dc2626; color: #fff; border-color: #dc2626; }
.tag.admin { background: #7c3aed; color: #fff; border-color: #7c3aed; }
.tag.photomod { background: #0891b2; color: #fff; border-color: #0891b2; }
.tag.ban { background: var(--danger); color: #fff; border-color: var(--danger); }
.tag.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.more { text-align: center; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.pcard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.pcard img.ph { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--panel2); cursor: zoom-in; display: block; }
.pcard .body { padding: 10px 12px; flex: 1; }
.pcard .body p { margin: 0 0 3px; }
.pcard .acts { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
.thumb { width: 56px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; cursor: zoom-in; }
.form { padding: 16px; display: grid; gap: 10px; max-width: 640px; }

.pcard.kfocus { outline: 3px solid var(--accent); outline-offset: 2px; }
.keyhint { margin: -6px 0 10px; }
@media (max-width: 760px) { .keyhint, #palBtn { display: none; } }
/* телефон: рядки списків переносяться, а не виходять за екран */
@media (max-width: 760px) {
  .row { flex-wrap: wrap; }
  .row .info { flex: 1 1 200px; }
  .row .acts { flex: 1 1 auto; justify-content: flex-start; }
  .toolbar .input { max-width: none; flex: 1 1 140px; }
  .dlg-box { max-height: 94vh; overflow-y: auto; }
  #top { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
  #top h1 { flex: 1 1 100%; font-size: 18px; }
  .me { flex-wrap: wrap; }
  #main { padding: 14px 12px 60px; }
}
/* діалог, лайтбокс, тост */
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.dlg-box { width: 100%; max-width: 440px; background: var(--panel); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.dlg-box h3 { margin: 0 0 8px; }
.dlg-box p { margin: 0 0 12px; color: var(--muted); }
.dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; padding: 16px; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 70; }
.toast { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); max-width: 340px; }
.toast.err { border-left-color: var(--danger); }

.chart { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding: 14px 16px 4px; }
.bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.bar:hover { opacity: 1; }
.chart-x { display: flex; gap: 4px; padding: 0 16px 12px; color: var(--muted); font-size: 11px; }
.chart-x span { flex: 1; text-align: center; }
.chart-total { float: right; font-weight: 400; color: var(--muted); }
.pcard { position: relative; }
.pick { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); border-radius: 8px; padding: 5px 7px; display: flex; }
.pick input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
.ucard { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px; z-index: 45; overflow-y: auto; }
.ucard-box { width: 100%; max-width: 720px; background: var(--panel); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.ucard-box h4 { margin: 18px 0 8px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.ucard-head { display: flex; gap: 14px; align-items: center; }
.ucard-head .avatar { width: 64px; height: 64px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs .thumb { width: 84px; height: 63px; }
.thumb.pending { outline: 2px solid var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); font-size: 13px; }
.cmt { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; overflow-wrap: anywhere; }
.cmt:last-child { border-bottom: none; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.imp-table th { text-align: left; padding: 6px 6px; color: var(--muted); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
.imp-table td { padding: 3px 4px; border-top: 1px solid var(--border); vertical-align: middle; }
.imp-table select { min-width: 120px; }
.imp-table input, .imp-table select { width: 100%; min-width: 70px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; }
.imp-table .st-ok { color: var(--ok); } .imp-table .st-warn { color: var(--warn); } .imp-table .st-err { color: var(--danger); } .imp-table .st-skip { color: var(--muted); }
.imp-wrap { max-height: 60vh; overflow: auto; }
@media (max-width: 860px) {
  #app { flex-direction: column; }
  #side { width: 100%; height: auto; position: static; flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; }
  #side h2 { display: none; }
  #side .grow { display: none; }
  #nav { display: flex; gap: 4px; }
  #side a.nav { white-space: nowrap; }
  .cols { grid-template-columns: 1fr; }
  #main { padding: 16px; }
  .row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>🛡️ Адмін-панель</h1>
    <p>Вхід для власника, адмінів і модераторів фото.</p>
    <input class="input" id="lgEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input class="input" id="lgPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="lgErr"></div>
    <button class="btn primary" id="lgBtn" type="submit" style="width:100%;justify-content:center">Увійти</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav id="side">
    <h2>🛡️ Адмін-панель</h2>
    <div id="nav"></div>
    <div class="grow"></div>
    <a class="nav" id="siteLink" href="#" target="_blank" rel="noopener">🌐 Відкрити сайт</a>
  </nav>
  <div id="content">
    <header id="top">
      <h1 id="pageTitle"></h1>
      <button class="btn small" id="palBtn" type="button" title="Швидкий пошук (Ctrl+K або /)">🔎 Ctrl+K</button>
      <button class="btn small" id="themeBtn" type="button" title="Тема">🌓</button>
      <div class="me"><img class="avatar" id="meAvatar" alt=""><span id="meName"></span><span class="tag" id="meRole"></span></div>
      <button class="btn small" id="logoutBtn" type="button">Вийти</button>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="dlg" class="dlg hidden">
  <div class="dlg-box">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <textarea class="input hidden" id="dlgInput" rows="3"></textarea>
    <div class="err" id="dlgErr"></div>
    <div class="dlg-btns">
      <button class="btn" id="dlgCancel" type="button">Скасувати</button>
      <button class="btn primary" id="dlgOk" type="button">Підтвердити</button>
    </div>
  </div>
</div>
<div id="ucard" class="ucard hidden"><div class="ucard-box" id="ucBody"></div></div>
<div id="lightbox" class="hidden"><img alt=""></div>
<div id="toasts"></div>

<script>
/* ============================ НАЛАШТУВАННЯ ============================ */
const SUPABASE_URL = 'https://fslbfqgzpsbkzbzamasa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Et7XDaX49e_J4RqfnoTpcA_e5yHEsS-';
const SITE_URL = 'https://gaimerctrl.github.io/transport/';   // адреса головного сайту
const DELETE_FUNCTION = 'smooth-handler';                      // Edge Function видалення акаунтів

/* ============================ ДОПОМІЖНЕ ============================ */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const RANK = { user: 0, photomod: 1, admin: 2, owner: 3 };
const ROLE_LABEL = { owner: 'OWNER', admin: 'ADMIN', photomod: 'PHOTOMOD', user: 'USER' };
const LOG_LABELS = {
  approve: 'прийняв місто', reject: 'відхилив місто', unpublish: 'зняв з публікації місто', delete: 'видалив місто',
  broadcast: 'надіслав оголошення', ban: 'заблокував акаунт', unban: 'розблокував акаунт',
  photo_approve: 'прийняв фото', photo_reject: 'відхилив фото', delete_account: 'видалив акаунт',
  set_role: 'змінив ранг акаунта', comment_delete: 'видалив коментар',
  report_dismiss: 'відхилив скаргу', report_resolve: 'закрив скаргу', maintenance: 'змінив режим техробіт',
  word_add: 'додав заборонене слово', word_del: 'видалив заборонене слово', backup: 'створив резервну копію', import_vehicles: 'імпортував транспорт', vehicles_bulk: 'змінив транспорт (масово)', vehicle_edit: 'змінив транспорт', vehicle_delete: 'видалив транспорт', vehicle_create: 'створив транспорт', model_rename: 'перейменував модель', vehicle_revert: 'відкотив зміну транспорту', points_rules: 'змінив правила балів', points_adjust: 'нарахував або зняв бали'
};
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#cfd3d8"/><circle cx="32" cy="24" r="11" fill="#9aa0a6"/><path d="M10 64c2-17 12-24 22-24s20 7 22 24z" fill="#9aa0a6"/></svg>');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const fmtDate = s => s ? new Date(s).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const escLike = s => String(s).replace(/[%_\\]/g, '\\$&');
const phUrl = p => db.storage.from('photos').getPublicUrl(p.path).data.publicUrl;
const phThumb = p => (p.thumb_path ? db.storage.from('photos').getPublicUrl(p.thumb_path).data.publicUrl : phUrl(p));
const userLink = (id, name) => el('a', { href: SITE_URL + '#user=' + id, target: '_blank', rel: 'noopener' }, name || '—');

function toast(msg, kind) {
  const t = el('div', { class: 'toast' + (kind === 'err' ? ' err' : '') }, msg);
  $('toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3000);
}

function openLightbox(src) {
  $('lightbox').firstElementChild.src = src;
  $('lightbox').classList.remove('hidden');
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.add('hidden'));

/* діалоги: повертають Promise */
let dlgDone = null;
function closeDlg(val) {
  $('dlg').classList.add('hidden');
  if (dlgDone) { const f = dlgDone; dlgDone = null; f(val); }
}
function dialog({ title, text, input, okLabel, danger, required }) {
  const oldChips = document.getElementById('dlgChips');
  if (oldChips) oldChips.remove();
  return new Promise(resolve => {
    $('dlgTitle').textContent = title;
    $('dlgText').textContent = text || '';
    $('dlgText').classList.toggle('hidden', !text);
    $('dlgInput').classList.toggle('hidden', !input);
    $('dlgInput').value = '';
    $('dlgInput').placeholder = input || '';
    $('dlgErr').textContent = '';
    $('dlgOk').textContent = okLabel || 'Підтвердити';
    $('dlgOk').className = 'btn ' + (danger ? 'danger' : 'primary');
    dlgDone = resolve;
    $('dlg').classList.remove('hidden');
    (input ? $('dlgInput') : $('dlgOk')).focus();
    $('dlgOk').onclick = () => {
      const v = $('dlgInput').value.trim();
      if (input && required && !v) { $('dlgErr').textContent = 'Заповніть це поле'; return; }
      closeDlg(input ? v : true);
    };
  });
}
$('dlgCancel').addEventListener('click', () => closeDlg(null));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('dlg').classList.contains('hidden')) closeDlg(null); $('lightbox').classList.add('hidden'); }
});
const PHOTO_REASONS = ['Низька якість фото', 'Дублікат', 'Невірне підприємство або борт. №', 'Порушення правил сайту', 'Реклама / водяні знаки', 'Не транспорт'];
const askReason = (title, okLabel, danger = true, templates) => {
  const p = dialog({ title, input: 'Причина', okLabel, danger, required: true });
  if (templates && templates.length) {
    $('dlgInput').insertAdjacentElement('afterend', el('div', { id: 'dlgChips', style: 'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px' },
      ...templates.map(t => el('button', { type: 'button', class: 'btn small', onclick: () => { $('dlgInput').value = t; $('dlgInput').focus(); } }, t))));
  }
  return p;
};
const askConfirm = (title, text, okLabel, danger) => dialog({ title, text, okLabel, danger });

function downloadCsv(name, rows) {
  const cell = v => {
    let t = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;          // захист від формул у Excel
    return /[",\n;]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function dailySeries(table, days) {
  const since = new Date();
  since.setHours(0, 0, 0, 0);
  since.setDate(since.getDate() - (days - 1));
  const { data } = await db.from(table).select('created_at').gte('created_at', since.toISOString()).limit(5000);
  const out = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(since); d.setDate(since.getDate() + i);
    out.push({ key: d.toDateString(), label: d.getDate(), title: d.toLocaleDateString('uk-UA'), n: 0 });
  }
  (data || []).forEach(r => { const k = new Date(r.created_at).toDateString(); const b = out.find(x => x.key === k); if (b) b.n++; });
  return out;
}
async function visitsSeries(days) {
  const since = new Date();
  since.setHours(0, 0, 0, 0);
  since.setDate(since.getDate() - (days - 1));
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const { data, error } = await db.from('site_stats').select('day, views').gte('day', iso(since)).order('day');
  if (error) return null;                      // таблиці ще немає (features2.sql не виконано)
  const byDay = {};
  (data || []).forEach(r => { byDay[r.day] = r.views; });
  const out = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(since); d.setDate(since.getDate() + i);
    out.push({ label: d.getDate(), title: d.toLocaleDateString('uk-UA'), n: byDay[iso(d)] || 0 });
  }
  return out;
}
function chartPanel(title, series) {
  const max = Math.max(1, ...series.map(x => x.n));
  const total = series.reduce((a, x) => a + x.n, 0);
  return el('div', { class: 'panel' },
    el('h3', null, title, el('span', { class: 'chart-total' }, 'разом: ' + total)),
    el('div', { class: 'chart' }, ...series.map(x => el('div', { class: 'bar', title: x.title + ': ' + x.n, style: 'height:' + Math.round(x.n / max * 100) + '%' }))),
    el('div', { class: 'chart-x' }, ...series.map(x => el('span', null, x.label))));
}

/* запити */
async function count(table, filter) {
  let q = db.from(table).select('*', { count: 'exact', head: true });
  if (filter) q = filter(q);
  const { count: n, error } = await q;
  return error ? null : n;
}
async function usersMap(ids) {
  const uniq = [...new Set(ids.filter(Boolean))];
  const map = {};
  for (let i = 0; i < uniq.length; i += 100) {
    const { data } = await db.from('profiles').select('id, username, avatar_url, role').in('id', uniq.slice(i, i + 100));
    (data || []).forEach(p => { map[p.id] = p; });
  }
  return map;
}
/* зміна/видалення з перевіркою, що запис справді змінився (RLS мовчки відсікає зайве) */
async function upd(table, patch, id) {
  const { data, error } = await db.from(table).update(patch).eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function del(table, id) {
  const { data, error } = await db.from(table).delete().eq('id', id).select('id');
  if (error) return error.message;
  if (!data || !data.length) return 'Немає прав або запис не знайдено';
  return '';
}
async function logAction(action, cityName, reason) {
  const { error } = await db.from('staff_log').insert({
    actor_id: me.id, actor_name: me.name || '', action, city_name: cityName || null, reason: reason || null
  });
  if (error) console.error(error);
}
async function notify(uid, message) {
  const { error } = await db.from('notifications').insert({ user_id: uid, message });
  if (error) toast('Сповіщення не надіслано: ' + error.message, 'err');
}

async function fillOverviewExtras(tok, covPanel, topPanel) {
  try {
    const since = Date.now() - 30 * 864e5;
    const [vs, ps, cs] = await Promise.all([
      fetchAllA('vehicles', 'city_id, enterprise_id, fleet_no, status', q => q, 30000),
      fetchAllA('photos', 'city_id, enterprise_id, fleet_no, owner_id, owner_name, views, created_at', q => q.eq('status', 'approved'), 50000),
      db.from('cities').select('id, name').then(r => r.data || [])
    ]);
    if (stale(tok)) return;
    const OLD = ['unknown', 'written_off', 'rebuilt', 'renumbered', 'plate_changed'];
    const have = new Set(ps.map(p => p.enterprise_id + '|' + String(p.fleet_no || '').trim()));
    const per = {};
    vs.filter(v => !OLD.includes(v.status)).forEach(v => {
      const c = per[v.city_id] = per[v.city_id] || { total: 0, ph: 0 };
      c.total++;
      if (have.has(v.enterprise_id + '|' + String(v.fleet_no).trim())) c.ph++;
    });
    const nm = Object.fromEntries(cs.map(c => [c.id, c.name]));
    const rows = Object.entries(per).sort((a, b) => b[1].total - a[1].total).slice(0, 8).map(([id, c]) => {
      const pct = Math.round((c.ph / c.total) * 100);
      return el('div', { class: 'row' }, el('div', { class: 'info' }, el('p', null, el('b', null, nm[id] || '—'), el('span', { class: 'sub' }, ' · ' + c.ph + ' з ' + c.total + ' (' + pct + '%)')),
        el('div', { style: 'height:6px;border-radius:4px;background:var(--panel2);margin-top:6px;overflow:hidden' }, el('i', { style: 'display:block;height:100%;width:' + pct + '%;background:var(--ok)' }))));
    });
    covPanel.replaceChildren(el('h3', null, '📷 Покриття фото за містами'), ...(rows.length ? rows : [el('div', { class: 'empty' }, 'Транспорту ще немає')]));
    const m = new Map();
    ps.filter(p => new Date(p.created_at).getTime() >= since).forEach(p => {
      const a = m.get(p.owner_id) || { id: p.owner_id, name: p.owner_name, n: 0, views: 0 };
      a.n++; a.views += Number(p.views) || 0; m.set(p.owner_id, a);
    });
    const top = [...m.values()].sort((a, b) => b.n - a.n).slice(0, 5);
    topPanel.replaceChildren(el('h3', null, '🏆 Топ фотографів за 30 днів'), ...(top.length ? top.map((a, i) => el('div', { class: 'row' },
      el('b', null, ['🥇', '🥈', '🥉'][i] || (i + 1)), el('div', { class: 'info' }, el('p', null, userLink(a.id, a.name)), el('p', { class: 'sub' }, a.n + ' фото · 👁 ' + a.views)))) : [el('div', { class: 'empty' }, 'За 30 днів нових фото немає')]));
  } catch (e) {
    covPanel.replaceChildren(el('h3', null, '📷 Покриття фото за містами'), el('div', { class: 'empty' }, String(e.message || e)));
    topPanel.replaceChildren(el('h3', null, '🏆 Топ фотографів за 30 днів'), el('div', { class: 'empty' }, '—'));
  }
}

function userRow(u) {
  const acts = el('div', { class: 'acts' });
  if (canManage(u)) {
    const roles = me.role === 'owner' ? ['user', 'photomod', 'admin'] : ['user', 'photomod'];
    const sel = el('select', { class: 'input', style: 'width:auto;padding:5px 8px', title: 'Ранг' },
      ...roles.map(r => el('option', { value: r, selected: u.role === r }, ROLE_LABEL[r])));
    if (!roles.includes(u.role)) sel.prepend(el('option', { value: u.role, selected: true }, ROLE_LABEL[u.role]));
    sel.addEventListener('change', () => setRole(u, sel.value, sel));
    acts.append(sel,
      el('button', { class: 'btn small' + (u.banned ? ' ok' : ''), onclick: () => toggleBan(u) }, u.banned ? 'Розблокувати' : 'Заблокувати'),
      el('button', { class: 'btn small danger', onclick: () => deleteAccount(u) }, 'Видалити'));
  }
  acts.append(el('button', { class: 'btn small', onclick: () => openUserCard(u) }, 'Картка'));
  return el('div', { class: 'row' + (u.banned ? ' banned' : '') },
    el('img', { class: 'avatar', src: u.avatar_url || PLACEHOLDER, alt: '' }),

async function setRole(u, role, sel) {
  if (role === u.role) return;
  const label = { user: 'Користувач', photomod: 'Photomod', admin: 'Admin' }[role];
  const ok = await askConfirm('Змінити ранг', 'Акаунт «' + u.username + '» отримає ранг: ' + label + '.', 'Змінити', false);
  if (!ok) { sel.value = u.role; return; }
  const { error } = await db.rpc('set_role', { target: u.id, new_role: role });
  if (error) { toast(error.message, 'err'); sel.value = u.role; return; }
  await logAction('set_role', u.username, label);
  await notify(u.id, 'Ваш ранг змінено: ' + label);
  toast('Ранг змінено');
  pgUsers(++renderTok);
}

async function toggleBan(u) {
  let reason = null;
  if (!u.banned) {
    reason = await askReason('Причина бану: ' + u.username, 'Заблокувати');
    if (reason == null) return;
  } else if (!(await askConfirm('Розблокувати «' + u.username + '»?', '', 'Розблокувати', false))) return;
  const { error } = await db.rpc('set_ban', { target: u.id, ban: !u.banned, reason });
  if (error) { toast(error.message, 'err'); return; }
  await logAction(u.banned ? 'unban' : 'ban', u.username, reason);
  toast(u.banned ? 'Розблоковано' : 'Заблоковано');
  pgUsers(++renderTok);
}

async function deleteAccount(u) {
  const reason = await askReason('Видалити «' + u.username + '» (причина піде на пошту)', 'Видалити акаунт');
  if (reason == null) return;
  const { data, error } = await db.functions.invoke(DELETE_FUNCTION, { body: { target: u.id, reason } });
  if (error) {
    let m = error.message;
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) { /* ignore */ }
    toast(m, 'err');
    return;
  }
  if (data && data.error) { toast(data.error, 'err'); return; }
  await logAction('delete_account', u.username, reason);
  toast(data && data.mail_error ? 'Акаунт видалено, але лист не надіслано: ' + data.mail_error : 'Акаунт видалено', data && data.mail_error ? 'err' : '');
  pgUsers(++renderTok);
}

const photosState = { tab: 'pending', limit: 48, sel: new Set(), city: '', q: '' };
let photoCursor = -1;
function photosQuery(st) {
  let q = db.from('photos').select('*').eq('status', st.tab);
  if (st.city) q = q.eq('city_id', st.city);
  if (st.q) q = q.ilike('owner_name', '%' + escLike(st.q) + '%');
  return q.order('created_at', { ascending: st.tab === 'pending' }).limit(st.limit);
}
function markPhoto(i) {
  const cards = [...document.querySelectorAll('#main .pcard')];
  cards.forEach(c => c.classList.remove('kfocus'));
  if (!cards.length) { photoCursor = -1; return; }
  photoCursor = Math.max(0, Math.min(cards.length - 1, i));
  cards[photoCursor].classList.add('kfocus');
  cards[photoCursor].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

  rejBtn.addEventListener('click', () => bulkReject(items.filter(p => st.sel.has(p.id))));

      el('input', { type: 'checkbox', checked: st.sel.has(p.id), onchange: e => { e.target.checked ? st.sel.add(p.id) : st.sel.delete(p.id); refreshBulk(); } })) : null;
    return el('div', { class: 'pcard' }, pick,
      el('img', { class: 'ph', src: thumbUrl, loading: 'lazy', alt: '', onclick: () => openLightbox(url) }),
      el('div', { class: 'body' },
        el('p', null, el('b', null, (p.city_name || '—') + ' · ' + (p.enterprise_name || '—'))),
        el('p', { class: 'sub' }, [p.fleet_no && 'Борт ' + p.fleet_no, p.model, p.plate_no].filter(Boolean).join(' · ') || '—'),
        el('p', { class: 'sub' }, 'Автор: ', a ? userLink(a.id, a.username) : (p.owner_name || '—'), ' · ' + fmtDate(p.created_at) + ' · 👁 ' + (p.views || 0))),
      acts);
  });
  const selectAll = st.tab === 'pending' && items.length ? el('button', { class: 'btn', type: 'button', onclick: () => {

    st.sel = new Set(all ? [] : items.map(p => p.id));
    document.querySelectorAll('.pick input').forEach(i => { i.checked = !all; });

  refreshBulk();
  const citySel = el('select', { class: 'input', style: 'max-width:220px' }, el('option', { value: '' }, 'Усі міста'), ...cityList.map(c => el('option', { value: c.id, selected: st.city === c.id }, c.name)));
  citySel.addEventListener('change', () => { st.city = citySel.value; st.limit = 48; photoCursor = -1; pgPhotos(++renderTok); });

  const keyHint = st.tab === 'pending' && items.length ? el('p', { class: 'sub keyhint' }, '⌨ ← → (або J K): вибір картки · A: схвалити · R: відхилити · Пробіл: виділити · Enter: збільшити') : null;
  show(tabs, el('div', { class: 'toolbar' }, citySel, authorIn), keyHint, selectAll ? el('div', { class: 'toolbar' }, selectAll, bulkBtn, rejBtn) : null, res.error ? el('div', { class: 'empty' }, res.error.message) :
    cards.length ? el('div', { class: 'grid' }, ...cards) : el('div', { class: 'panel' }, el('div', { class: 'empty' }, 'Тут порожньо')),
    cards.length >= st.limit ? el('div', { class: 'more' }, el('button', { class: 'btn', onclick: () => { st.limit += 48; pgPhotos(++renderTok); } }, 'Показати ще')) : null);
  if (photoCursor >= 0) setTimeout(() => markPhoto(photoCursor), 0);
}

let rulesCacheA;
async function getRulesA() {
  if (rulesCacheA !== undefined) return rulesCacheA;
  const r = await db.from('points_rules').select('key, points');
  rulesCacheA = (r.error || !(r.data || []).length) ? null : Object.fromEntries(r.data.map(x => [x.key, Number(x.points)]));
  return rulesCacheA;
}
/* скільки балів принесе схвалення фото (перше фото машини дає бонус) */
async function approvalPoints(p, seen) {
  const r = await getRulesA();
  if (!r || r.photo == null) return null;
  let pts = r.photo;
  const fn = String(p.fleet_no || '').trim();
  if (p.enterprise_id && fn) {
    const key = p.enterprise_id + '|' + fn;
    const { count, error } = await db.from('photos').select('id', { count: 'exact', head: true }).eq('status', 'approved').eq('enterprise_id', p.enterprise_id).eq('fleet_no', p.fleet_no);
    if (!error && count === 0 && !(seen && seen.has(key))) pts += r.first || 0;
    if (seen) seen.add(key);
  }
  return pts;
}
const ptsTail = pts => (pts ? '. Ви отримали +' + pts + ' балів' : '');
async function photoApprove(p) {
  const pts = await approvalPoints(p);
  const err = await upd('photos', { status: 'approved' }, p.id);
  if (err) { toast(err, 'err'); return; }
  await logAction('photo_approve', p.city_name, p.enterprise_name);
  await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» прийнято і опубліковано' + ptsTail(pts));
  toast('Фото схвалено'); refreshBadges(); pgPhotos(++renderTok);
}
async function bulkApprove(list) {
  if (!list.length) return;
  if (!(await askConfirm('Схвалити ' + list.length + ' фото?', 'Автори отримають сповіщення про публікацію.', 'Схвалити', false))) return;
  let ok = 0, fail = '';
  const seen = new Set();
  for (const p of [...list].sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))) {
    const pts = await approvalPoints(p, seen);
    const err = await upd('photos', { status: 'approved' }, p.id);
    if (err) { fail = err; continue; }
    ok++;
    await logAction('photo_approve', p.city_name, p.enterprise_name);
    await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» прийнято і опубліковано' + ptsTail(pts));
  }
  photosState.sel.clear();
  toast('Схвалено: ' + ok + (fail ? ' · помилки: ' + fail : ''), fail ? 'err' : '');
  refreshBadges(); pgPhotos(++renderTok);
}
async function bulkReject(list) {
  if (!list.length) return;
  const reason = await askReason('Відхилити ' + list.length + ' фото?', 'Відхилити', true, PHOTO_REASONS);
  if (reason == null) return;
  let ok = 0; let fail = '';
  for (const p of list) {
    const err = await del('photos', p.id);
    if (err) { fail = err; continue; }
    ok++;
    try { await db.storage.from('photos').remove([p.path, p.thumb_path].filter(Boolean)); } catch (e) { /* файл можна прибрати пізніше */ }
    await logAction('photo_reject', p.city_name, reason);
    await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» відхилено. Причина: ' + reason);
  }
  photosState.sel.clear();
  toast('Відхилено: ' + ok + (fail ? ' · помилки: ' + fail : ''), fail ? 'err' : '');
  refreshBadges(); pgPhotos(++renderTok);
}
async function photoReject(p, title, okLabel) {
  const reason = await askReason(title, okLabel, true, PHOTO_REASONS);
  if (reason == null) return;
  const err = await del('photos', p.id);
  if (err) { toast(err, 'err'); return; }
  try { await db.storage.from('photos').remove([p.path, p.thumb_path].filter(Boolean)); } catch (e) { /* файл можна прибрати пізніше */ }
  await logAction('photo_reject', p.city_name, reason);
  await notify(p.owner_id, 'Ваше фото (' + (p.enterprise_name || '') + ') у місті «' + (p.city_name || '') + '» відхилено. Причина: ' + reason);
  toast('Фото видалено'); refreshBadges(); pgPhotos(++renderTok);
}

document.addEventListener('keydown', e => {
  if (!me || location.hash !== '#photos' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || !$('dlg').classList.contains('hidden') || document.querySelector('.dlg.xm') || !$('lightbox').classList.contains('hidden')) return;
  const cards = [...document.querySelectorAll('#main .pcard')];
  if (!cards.length) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'j') { e.preventDefault(); markPhoto(photoCursor + 1); }
  else if (k === 'arrowleft' || k === 'k') { e.preventDefault(); markPhoto(photoCursor - 1); }
  else if (photoCursor >= 0 && cards[photoCursor]) {
    const c = cards[photoCursor];
    if (k === 'a') { const b = c.querySelector('.btn.ok'); if (b) b.click(); }
    else if (k === 'r') { const b = c.querySelector('.btn.danger'); if (b) b.click(); }
    else if (k === ' ') { e.preventDefault(); const b = c.querySelector('.pick input'); if (b) b.click(); }
    else if (k === 'enter' || k === 'z') { const b = c.querySelector('img.ph'); if (b) b.click(); }
  }
});

  show(

const au = { sort: 'approved', dir: -1, q: '' };
async function pgAuthors(tok) {
  let rows;
  try { rows = await fetchAllA('photos', 'owner_id, owner_name, status, views, created_at', q => q, 50000); } catch (e) { show(el('div', { class: 'panel' }, el('div', { class: 'empty' }, e.message))); return; }

    el('div', { class: 'cards' }, el('div', { class: 'stat' }, el('b', null, m.size), el('span', null, 'авторів')), el('div', { class: 'stat' }, el('b', null, rows.length.toLocaleString('uk-UA')), el('span', null, 'фото всього')),
      el('div', { class: 'stat' }, el('b', null, rows.reduce((a, p) => a + (Number(p.views) || 0), 0).toLocaleString('uk-UA')), el('span', null, 'переглядів'))),

      el('button', { class: 'btn', onclick: () => downloadCsv('authors.csv', [['Нік', 'Схвалено', 'На модерації', 'Перегляди', 'Остання публікація']].concat(list.map(a => [a.name, a.approved, a.pending, a.views, a.last]))) }, '⬇ CSV')),
    el('div', { class: 'panel' }, list.length ? list.slice(0, 200).map((a, i) => el('div', { class: 'row' },
      el('b', { style: 'min-width:34px' }, i + 1), el('div', { class: 'info' }, el('p', null, userLink(a.id, a.name)), el('p', { class: 'sub' }, 'Остання: ' + (a.last ? fmtDate(a.last) : '—'))),
      el('div', { class: 'acts' }, a.points ? el('span', { class: 'tag', style: 'font-weight:800' }, '🏅 ' + fmtN(a.points)) : null, el('span', { class: 'tag ok' }, a.approved + ' схвалено'), a.pending ? el('span', { class: 'tag' }, a.pending + ' на модерації') : null, el('span', { class: 'tag' }, '👁 ' + a.views)))) : el('div', { class: 'empty' }, 'Авторів не знайдено')));

/* ============================ СКАРГИ ============================ */
const reportsState = { tab: 'open' };
const REASONS = { spam: 'Спам', inappropriate: 'Неприйнятний вміст', copyright: 'Авторські права', other: 'Інше' };

async function pgReports(tok) {
  const st = reportsState;
  const base = db.from('reports').select('*');
  const [cOpen, res] = await Promise.all([
    count('reports', q => q.eq('status', 'open')),
    (st.tab === 'open' ? base.eq('status', 'open') : base.neq('status', 'open'))
      .order('created_at', { ascending: st.tab === 'open' }).limit(200)
  ]);
  const groups = new Map();
  (res.data || []).forEach(r => {
    const k = r.target_type + ':' + r.target_id;
    if (!groups.has(k)) groups.set(k, { type: r.target_type, id: r.target_id, reports: [] });
    groups.get(k).reports.push(r);
  });
  const list = [...groups.values()];
  const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };
  const photos = {}, comments = {};
  for (const part of chunk(list.filter(g => g.type === 'photo').map(g => g.id), 100)) {
    const r = await db.from('photos').select('*').in('id', part);
    (r.data || []).forEach(x => { photos[x.id] = x; });
  }
  for (const part of chunk(list.filter(g => g.type === 'comment').map(g => g.id), 100)) {
    const r = await db.from('photo_comments').select('id, owner_id, owner_name, body, photo_id').in('id', part);
    (r.data || []).forEach(x => { comments[x.id] = x; });
  }
  const reporters = await usersMap((res.data || []).map(r => r.reporter_id));
  if (stale(tok)) return;

  const tabs = el('div', { class: 'tabs' },
    el('button', { class: 'tab' + (st.tab === 'open' ? ' active' : ''), onclick: () => { st.tab = 'open'; pgReports(++renderTok); } }, 'Відкриті' + (cOpen != null ? ' (' + cOpen + ')' : '')),
    el('button', { class: 'tab' + (st.tab === 'closed' ? ' active' : ''), onclick: () => { st.tab = 'closed'; pgReports(++renderTok); } }, 'Розглянуті'));

  const rows = list.map(g => {
    const target = g.type === 'photo' ? photos[g.id] : comments[g.id];
    const counts = {};
    g.reports.forEach(r => { counts[r.reason] = (counts[r.reason] || 0) + 1; });
    const summary = Object.entries(counts).map(([k, n]) => (REASONS[k] || k) + (n > 1 ? ' ×' + n : '')).join(', ');
    const url = g.type === 'photo' && target ? phUrl(target) : null;
    const turl = g.type === 'photo' && target ? phThumb(target) : null;
    const who = target ? el('p', { class: 'sub' }, 'Автор: ', userLink(target.owner_id, target.owner_name)) : null;
    const body = target
      ? (g.type === 'photo'
        ? el('p', null, el('b', null, '📷 ' + (target.city_name || '—') + ' · ' + (target.enterprise_name || '—')))
        : el('p', { style: 'white-space:pre-wrap;overflow-wrap:anywhere' }, el('b', null, '💬 '), target.body))
      : el('p', { class: 'sub' }, 'Контент уже видалено');
    const details = g.reports.slice(0, 4).map(r => el('p', { class: 'sub' },
      '• ', (reporters[r.reporter_id] || {}).username || '—', ': ', REASONS[r.reason] || r.reason, r.details ? ' — ' + r.details : '',
      r.status !== 'open' ? ' [' + (r.status === 'resolved' ? 'розглянуто' : 'відхилено') + ']' : ''));
    const acts = el('div', { class: 'acts' });
    if (st.tab === 'open') {
      if (target) acts.append(el('button', { class: 'btn small danger', onclick: () => reportDeleteTarget(g, target) }, 'Видалити контент'));
      acts.append(
        el('button', { class: 'btn small', onclick: () => reportClose(g, 'dismissed') }, 'Відхилити скаргу'),
        el('button', { class: 'btn small ok', onclick: () => reportClose(g, 'resolved') }, 'Розглянуто'));
    }
    return el('div', { class: 'row', style: 'align-items:flex-start' },
      url ? el('img', { class: 'thumb', style: 'width:96px;height:72px', src: turl, loading: 'lazy', alt: '', onclick: () => openLightbox(url) }) : null,
      el('div', { class: 'info' }, body, who,
        el('p', { class: 'sub' }, el('span', { class: 'tag ban' }, g.reports.length + ' скарг'), ' ' + summary + ' · ' + fmtDate(g.reports[0].created_at)),
        ...details),
      acts);
  });
  show(tabs, el('div', { class: 'panel' }, res.error ? el('div', { class: 'empty' }, res.error.message) : rows.length ? rows : el('div', { class: 'empty' }, 'Скарг немає 🎉')));
}

async function closeReports(g, status) {
  const { error } = await db.from('reports').update({ status, resolved_by: me.id, resolved_at: new Date().toISOString() })
    .eq('target_type', g.type).eq('target_id', g.id).eq('status', 'open').select('id');
  return error ? error.message : '';
}
async function reportClose(g, status) {
  const err = await closeReports(g, status);
  if (err) { toast(err, 'err'); return; }
  await logAction(status === 'dismissed' ? 'report_dismiss' : 'report_resolve', null, (g.type === 'photo' ? 'фото ' : 'коментар ') + g.id.slice(0, 8));
  toast(status === 'dismissed' ? 'Скаргу відхилено' : 'Скаргу закрито');
  refreshBadges(); pgReports(++renderTok);
}
async function reportDeleteTarget(g, t) {
  const reason = await askReason('Причина видалення', 'Видалити контент');
  if (reason == null) return;
  let err;
  if (g.type === 'photo') {
    err = await del('photos', t.id);
    if (!err) {
      try { await db.storage.from('photos').remove([t.path, t.thumb_path].filter(Boolean)); } catch (e) { /* ignore */ }
      await logAction('photo_reject', t.city_name, 'скарга: ' + reason);
      await notify(t.owner_id, 'Ваше фото (' + (t.enterprise_name || '') + ') у місті «' + (t.city_name || '') + '» видалено за скаргою. Причина: ' + reason);
    }
  } else {
    err = await del('photo_comments', t.id);
    if (!err) {
      await logAction('comment_delete', null, (t.owner_name || '') + ': ' + String(t.body).slice(0, 100) + ' (скарга: ' + reason + ')');
      await notify(t.owner_id, 'Ваш коментар видалено за скаргою. Причина: ' + reason);
    }
  }
  if (err) { toast(err, 'err'); return; }
  const e2 = await closeReports(g, 'resolved');
  if (e2) toast(e2, 'err');

}

/* ============================ ІМПОРТ ТРАНСПОРТУ ============================ */
const IMP_TYPES = [['bus', 'Автобус'], ['trolleybus', 'Тролейбус'], ['tram', 'Трамвай'], ['metro', 'Метро / залізниця'], ['monorail', 'Монорейка'], ['funicular', 'Фунікулер'], ['other', 'Інше']];
const IMP_STATUSES = [
  ['active', 'Експлуатується'], ['not_here', 'Не експлуатувався у цьому місті'], ['inactive', 'Не експлуатується'],
  ['withdrawn', 'Виведений з експлуатації / очікує списання'], ['written_off', 'Списаний'], ['unknown', 'Місцезнаходження і доля невідомі'],
  ['rebuilt', 'КВР/модернізація'], ['renumbered', 'Перенумеровано/передано'], ['plate_changed', 'Зміна держномера']
];
const IMP_COLS = {
  type: ['тип', 'вид', 'type', 'vehicletype'], fleet: ['борт', 'бортовий', 'бортовий№', '№', 'номер', 'бортовийномер', 'fleet', 'fleetno', 'num'],
  extra: ['додатковий', 'додатковий№', 'extra', 'extrano', 'extranum'], plate: ['держ', 'держ№', 'держномер', 'держномер№', 'plate', 'plateno', 'gosnum'],
  model: ['модель', 'model'], factory: ['зав', 'зав№', 'заводський', 'заводський№', 'factory', 'factoryno', 'serial'],
  year: ['рік', 'рікпобудови', 'ріквипуску', 'побуд', 'year', 'buildyear'], vin: ['vin'],
  arrived: ['надійшов', 'прибув', 'arrived'], start: ['початок', 'почроб', 'початокроботи', 'початокексплуатації', 'start', 'startdate'],
  written_off: ['списаний', 'writtenoff', 'decommissioned'], status: ['статус', 'status'], note: ['примітка', 'note'], source: ['джерело', 'source']
};
const impState = { rows: [], existing: new Set(), cityId: '', entId: 'new', entName: 'ХКП «Електротранс»', defType: 'trolleybus', expand: true, plateAsFleet: true, enterprises: [] };

function impParseTable(text) {
  const lines = String(text || '').replace(/^\ufeff/, '').replace(/\r/g, '').split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
  if (lines.length < 2) return [];
  const count = (d) => lines[0].split(d).length - 1;
  const delim = ['\t', ';', ','].map(d => [d, count(d)]).sort((a, b) => b[1] - a[1])[0][0];
  const split = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true;
      else if (c === delim) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(x => x.trim());
  };
  const norm = h => String(h).toLowerCase().replace(/[^a-zа-яіїєґ0-9№]/g, '');
  const head = split(lines[0]).map(norm);
  const map = {};
  head.forEach((h, i) => { for (const [k, names] of Object.entries(IMP_COLS)) if (names.includes(h) && map[k] == null) map[k] = i; });
  if (map.fleet == null && map.plate == null) throw new Error('Не знайдено колонку з бортовим номером (Борт / №) у першому рядку');
  if (map.model == null) throw new Error('Не знайдено колонку «Модель» у першому рядку');
  return lines.slice(1).map(l => {
    const c = split(l);
    const g = k => (map[k] != null ? c[map[k]] || '' : '');
    return { type: g('type'), fleet: g('fleet'), extra: g('extra'), plate: g('plate'), model: g('model'), factory: g('factory'), year: g('year'),
      vin: g('vin'), arrived: g('arrived'), start: g('start'), written_off: g('written_off'), status: g('status'), note: g('note') };
  });
}

function impType(v, def) {
  const t = String(v || '').trim().toLowerCase();
  if (!t) return def;
  const keys = IMP_TYPES.map(x => x[0]);
  if (keys.includes(t)) return t;
  if (/тролейб|троллейб|^тр$/.test(t)) return 'trolleybus';
  if (/автобус|^а$/.test(t)) return 'bus';
  if (/трамв|^т$/.test(t)) return 'tram';
  if (/метро|залізн/.test(t)) return 'metro';
  if (/монорей/.test(t)) return 'monorail';
  if (/фунікул/.test(t)) return 'funicular';
  return def;
}
function impStatus(v) {
  const t = String(v || '').trim().toLowerCase();
  if (!t) return '';
  if (IMP_STATUSES.some(x => x[0] === t)) return t;
  if (/^експлуат|^працю|^діє/.test(t)) return 'active';
  if (/^не експлуат/.test(t)) return 'inactive';
  if (/списан/.test(t)) return 'written_off';
  if (/виведен|очікує/.test(t)) return 'withdrawn';
  if (/невідом/.test(t)) return 'unknown';
  if (/квр|модерн/.test(t)) return 'rebuilt';
  if (/перенумер|переда/.test(t)) return 'renumbered';
  if (/зміна держ/.test(t)) return 'plate_changed';
  if (/не експлуатувався/.test(t)) return 'not_here';
  return '';
}
const impYear = v => { const m = String(v || '').match(/(\d{4})\s*$/); return m ? Number(m[1]) : null; };

/* "014-044", "268, 271, 280, 282–287" -> окремі номери (нулі зліва зберігаються) */
function impExpand(raw, on) {
  const text = String(raw || '').trim();
  if (!on || !/[,;–—-]/.test(text)) return [text];
  const out = [];
  for (const tok of text.split(/[,;]+/).map(x => x.trim()).filter(Boolean)) {
    const m = tok.match(/^(\d+)\s*[-–—]\s*(\d+)$/);
    if (m && Number(m[2]) >= Number(m[1]) && Number(m[2]) - Number(m[1]) < 400) {
      const w = m[1].length;
      for (let n = Number(m[1]); n <= Number(m[2]); n++) out.push(String(n).padStart(w, '0'));
    } else out.push(tok);
  }
  return out.length ? out : [text];
}

function impBuildRows(parsed) {
  const st = impState; const rows = [];
  parsed.forEach(r => {
    const fleets = impExpand(r.fleet, st.expand);
    const multi = fleets.length > 1;
    fleets.forEach(f => rows.push({
      type: impType(r.type, st.defType), fleet: f, extra: multi ? '' : r.extra, plate: multi ? '' : r.plate, model: r.model,
      factory: multi ? '' : r.factory, year: r.year, vin: multi ? '' : r.vin, arrived: r.arrived, start: r.start, written_off: r.written_off,
      status: impStatus(r.status), note: r.note, done: false
    }));
  });
  if (st.plateAsFleet) rows.forEach(r => { if (!String(r.fleet).trim() && String(r.plate).trim()) r.fleet = r.plate; });
  return rows;
}
const impKey = (f, p, m) => [f, p, m].map(x => String(x == null ? '' : x).trim()).join('|');

function impCheck() {
  const seen = new Set();
  impState.rows.forEach(r => {
    const f = String(r.fleet).trim(), m = String(r.model).trim();
    r._msg = ''; r._lvl = 'ok';
    if (r.done) { r._msg = 'імпортовано'; r._lvl = 'skip'; return; }
    if (!f) { r._msg = 'немає борту'; r._lvl = 'err'; return; }
    if (!m) { r._msg = 'немає моделі'; r._lvl = 'err'; return; }
    if (r.year && !(Number(r.year) >= 1900 && Number(r.year) <= 2100)) { r._msg = 'рік?'; r._lvl = 'err'; return; }
    const k = impKey(f, r.plate, m);
    if (impState.existing.has(k)) { r._msg = 'вже є в базі'; r._lvl = 'skip'; return; }
    if (seen.has(k)) { r._msg = 'дубль у списку'; r._lvl = 'skip'; return; }
    seen.add(k);
    if (!r.status) { r._msg = 'статус не вказано → «Експлуатується»'; r._lvl = 'warn'; }
  });
}

async function pgImport(tok) {
  const st = impState;
  const { data: cityList } = await db.from('cities').select('id, name, country').order('name');
  if (stale(tok)) return;
  const cities = cityList || [];
  if (!st.cityId) { const h = cities.find(c => /хмельницьк/i.test(c.name)); st.cityId = h ? h.id : (cities[0] ? cities[0].id : ''); }

  const citySel = el('select', { class: 'input' }, ...cities.map(c => el('option', { value: c.id, selected: c.id === st.cityId }, c.name + (c.country ? ' · ' + c.country : ''))));
  const entSel = el('select', { class: 'input' });
  const entName = el('input', { class: 'input', placeholder: 'Назва нового підприємства', value: st.entName });
  const defType = el('select', { class: 'input', style: 'max-width:200px' }, ...IMP_TYPES.map(([k, l]) => el('option', { value: k, selected: st.defType === k }, l)));
  const chkExpand = el('input', { type: 'checkbox', checked: st.expand });
  const chkPlate = el('input', { type: 'checkbox', checked: st.plateAsFleet });
  const area = el('textarea', { class: 'input', rows: 8, placeholder: 'Вставте таблицю з Excel / Google Sheets разом із заголовками колонок…' });
  const fileIn = el('input', { type: 'file', accept: '.csv,.tsv,.txt,text/csv,text/plain' });
  const msg = el('div', { class: 'err' });
  const preview = el('div');

  async function loadEnts() {
    st.cityId = citySel.value;
    const { data } = await db.from('enterprises').select('id, name, transport_types').eq('city_id', st.cityId).order('name');
    st.enterprises = data || [];
    const pref = st.enterprises.find(e => /електротранс/i.test(e.name));
    st.entId = pref ? pref.id : 'new';
    entSel.replaceChildren(...st.enterprises.map(e => el('option', { value: e.id, selected: e.id === st.entId }, e.name)), el('option', { value: 'new', selected: st.entId === 'new' }, '➕ Створити нове підприємство…'));
    syncEnt();
  }
  async function syncEnt() {
    st.entId = entSel.value;
    entName.classList.toggle('hidden', st.entId !== 'new');
    st.existing = new Set();
    if (st.entId !== 'new') {
      for (let from = 0; ; from += 1000) {
        const { data } = await db.from('vehicles').select('fleet_no, plate_no, model').eq('enterprise_id', st.entId).range(from, from + 999);
        (data || []).forEach(v => st.existing.add(impKey(v.fleet_no, v.plate_no, v.model)));
        if (!data || data.length < 1000) break;
      }
    }
    drawPreview();
  }
  citySel.addEventListener('change', loadEnts);
  entSel.addEventListener('change', syncEnt);
  entName.addEventListener('input', () => { st.entName = entName.value; });
  defType.addEventListener('change', () => { st.defType = defType.value; });
  chkExpand.addEventListener('change', () => { st.expand = chkExpand.checked; });
  chkPlate.addEventListener('change', () => { st.plateAsFleet = chkPlate.checked; });

  let parsedCache = [];
  function readText(text) {
    msg.style.color = '';
    try {
      parsedCache = impParseTable(text);
      if (!parsedCache.length) { msg.textContent = 'У даних немає рядків (потрібні заголовок і хоча б один рядок)'; st.rows = []; drawPreview(); return; }
      st.rows = impBuildRows(parsedCache);
      msg.textContent = '';
      drawPreview();
    } catch (e) { msg.textContent = e.message; }
  }
  const readBtn = el('button', { class: 'btn primary', type: 'button', onclick: () => readText(area.value) }, 'Прочитати дані');
  fileIn.addEventListener('change', async () => { const f = fileIn.files[0]; if (f) { area.value = await f.text(); readText(area.value); } });

  function drawPreview() {
    impCheck();
    const rows = st.rows;
    const cnt = k => rows.filter(r => r._lvl === k).length;
    const ready = rows.filter(r => r._lvl === 'ok' || r._lvl === 'warn').length;
    const sumText = () => 'Рядків: ' + rows.length + ' · готово до імпорту: ' + (cnt('ok') + cnt('warn')) + ' · пропущено: ' + cnt('skip') + ' · помилок: ' + cnt('err') + (cnt('warn') ? ' · зі статусом за замовчуванням: ' + cnt('warn') : '');
    const sum = el('div', { class: 'sub', style: 'padding:10px 16px' }, sumText());
    const importBtn = el('button', { class: 'btn ok', type: 'button', disabled: !ready || cnt('err') > 0 }, ready ? '📥 Імпортувати ' + ready + ' ТЗ' : 'Нічого імпортувати');
    importBtn.addEventListener('click', () => impRun(importBtn, msg, drawPreview));
    const cell = (r, key, w) => { const i = el('input', { value: r[key] == null ? '' : r[key], style: w ? 'min-width:' + w + 'px' : '' }); i.addEventListener('input', () => { r[key] = i.value; impCheck(); refreshBadges2(); }); return i; };
    const selCell = (r, key, opts, blank) => { const sl = el('select', null, ...(blank ? [el('option', { value: '' }, blank)] : []), ...opts.map(([k, l]) => el('option', { value: k, selected: r[key] === k }, l))); sl.addEventListener('change', () => { r[key] = sl.value; impCheck(); refreshBadges2(); }); return sl; };
    const badges = [];
    function refreshBadges2() {
      badges.forEach(([b, r]) => { b.textContent = r._msg || '✔'; b.className = 'st-' + r._lvl; });
      sum.textContent = sumText();
      const ready2 = st.rows.filter(r => r._lvl === 'ok' || r._lvl === 'warn').length, errs = st.rows.filter(r => r._lvl === 'err').length;
      importBtn.disabled = !ready2 || errs > 0; importBtn.textContent = ready2 ? '📥 Імпортувати ' + ready2 + ' ТЗ' : 'Нічого імпортувати';
    }
    const table = el('table', { class: 'imp-table' },
      el('thead', null, el('tr', null, ...['#', 'Тип', 'Борт', 'Держ. №', 'Модель', 'Зав. №', 'Рік', 'VIN', 'Надійшов', 'Початок', 'Списаний', 'Статус', 'Примітка', 'Перевірка', ''].map(h => el('th', null, h)))),
      el('tbody', null, ...rows.map((r, i) => {

async function impRun(btn, msg, redraw) {
  const st = impState;
  const todo = st.rows.filter(r => r._lvl === 'ok' || r._lvl === 'warn');
  if (!todo.length) return;
  const city = (await db.from('cities').select('id, name').eq('id', st.cityId).maybeSingle()).data;
  let entId = st.entId, entTitle = '';
  const types = [...new Set(todo.map(r => r.type))].slice(0, 5);
  const ok = await askConfirm('Імпортувати ' + todo.length + ' ТЗ?', 'Місто: ' + (city ? city.name : '—') + '. ' + (entId === 'new' ? 'Буде створено підприємство «' + st.entName.trim() + '».' : 'Додаємо в наявне підприємство.'), 'Імпортувати', false);
  if (!ok) return;
  btn.disabled = true; msg.style.color = '';
  try {
    if (entId === 'new') {
      const name = st.entName.trim();
      if (!name) throw new Error('Вкажіть назву підприємства');
      msg.textContent = 'Створюю підприємство…';
      const r = await db.from('enterprises').insert({ city_id: st.cityId, owner_id: me.id, name, transport_types: types, status: 'active' }).select('id').single();
      if (r.error) throw r.error;
      entId = r.data.id; entTitle = name;
    } else {
      const e = st.enterprises.find(x => x.id === entId);
      entTitle = e ? e.name : '';
      const merged = [...new Set([...(e && e.transport_types || []), ...types])].slice(0, 5);
      if (e && merged.length !== (e.transport_types || []).length) {
        const err = await upd('enterprises', { transport_types: merged }, entId);
        if (err) throw new Error(err);
        e.transport_types = merged;
      }
    }
    const t = v => String(v == null ? '' : v).trim() || null;
    const rows = todo.map(r => ({
      city_id: st.cityId, enterprise_id: entId, owner_id: me.id, fleet_no: String(r.fleet).trim(), extra_no: t(r.extra), plate_no: t(r.plate),
      vehicle_type: r.type, model: String(r.model).trim(), factory_no: t(r.factory), build_year: impYear(r.year), vin: t(r.vin),
      start_date: t(r.start), arrived: t(r.arrived), written_off: t(r.written_off), status: r.status || 'active', note: t(r.note)
    }));
    let done = 0;
    for (let i = 0; i < rows.length; i += 50) {
      msg.textContent = 'Імпортую… ' + done + ' з ' + rows.length;
      const { error } = await db.from('vehicles').insert(rows.slice(i, i + 50));
      if (error) throw new Error(error.message + ' (імпортовано ' + done + ')');
      todo.slice(i, i + 50).forEach(r => { r.done = true; st.existing.add(impKey(r.fleet, r.plate, r.model)); });
      done += Math.min(50, rows.length - i);
    }
    await logAction('import_vehicles', city ? city.name : null, done + ' ТЗ у «' + entTitle + '»');
    msg.style.color = 'var(--ok)'; msg.textContent = 'Готово: імпортовано ' + done + ' ТЗ у «' + entTitle + '»';
    if (st.entId === 'new') { st.entId = entId; }
    toast('Імпортовано ТЗ: ' + done);
  } catch (e) {
    msg.textContent = 'Помилка: ' + (e.message || e);
  }
  redraw();
}

async function pgBroadcast(tok) {

  sendAll.addEventListener('click', async () => {
    const t = text.value.trim();
    if (!t) { msg.style.color = ''; msg.textContent = 'Введіть текст'; return; }

    sendAll.disabled = true; msg.textContent = '';
    const ids = [];
    for (let from = 0; ; from += 1000) {

      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
      ids.push(...data.map(p => p.id));
      if (data.length < 1000) break;
    }
    for (let i = 0; i < ids.length; i += 500) {
      const { error } = await db.from('notifications').insert(ids.slice(i, i + 500).map(id => ({ user_id: id, message: 'Оголошення: ' + t })));
      if (error) { msg.textContent = error.message; sendAll.disabled = false; return; }
    }
    await logAction('broadcast', null, t);
    text.value = ''; sendAll.disabled = false;
    msg.style.color = 'var(--ok)'; msg.textContent = 'Надіслано користувачам: ' + ids.length;
  });

  sendOne.addEventListener('click', async () => {
    const n = nick.value.trim(), t = text2.value.trim();
    msg2.style.color = '';
    if (!n || !t) { msg2.textContent = 'Вкажіть нік і текст'; return; }

    const { error } = await db.from('notifications').insert({ user_id: data.id, message: t });
    if (error) { msg2.textContent = error.message; return; }
    text2.value = ''; msg2.style.color = 'var(--ok)'; msg2.textContent = 'Надіслано: ' + data.username;
  });

  if (stale(tok)) return;
  show(
    el('div', { class: 'panel' }, el('h3', null, '📣 Оголошення всім'), el('div', { class: 'form' }, text, msg, el('div', null, sendAll))),
    el('div', { class: 'panel' }, el('h3', null, '✉️ Повідомлення одному користувачу'), el('div', { class: 'form' }, nick, text2, msg2, el('div', null, sendOne))));
}

function vhApply(q) {
  if (vh.city) q = q.eq('city_id', vh.city);
  if (vh.ent) q = q.eq('enterprise_id', vh.ent);
  if (vh.status) q = q.eq('status', vh.status);
  if (vh.type) q = q.eq('vehicle_type', vh.type);
  if (vh.issue === 'noyear') q = q.is('build_year', null);
  if (vh.issue === 'novin') q = q.is('vin', null);
  if (vh.issue === 'nofactory') q = q.is('factory_no', null);
  if (vh.q) {
    const s = escLike(vh.q).replace(/[,()"]/g, ' ');
    q = q.or('fleet_no.ilike.%' + s + '%,plate_no.ilike.%' + s + '%,model.ilike.%' + s + '%,vin.ilike.%' + s + '%,factory_no.ilike.%' + s + '%');

}

/* ============================ МОДЕЛІ: нормалізація назв ============================ */
const md = { city: '', ent: '' };
const normModel = s => String(s || '').toLowerCase().replace(/[^a-zа-яіїєґ0-9]/g, '');

async function pgModels(tok) {
  const [c, e] = await Promise.all([db.from('cities').select('id, name').order('name'), db.from('enterprises').select('id, name, city_id').order('name').limit(3000)]);
  if (stale(tok)) return;
  const cities = c.data || []; const ents = e.data || [];
  const scope = q => { if (md.city) q = q.eq('city_id', md.city); if (md.ent) q = q.eq('enterprise_id', md.ent); return q; };
  let rows;
  try { rows = await fetchAllA('vehicles', 'id, model', q => scope(q), 20000); } catch (err) { show(el('div', { class: 'panel' }, el('div', { class: 'empty' }, err.message))); return; }
  if (stale(tok)) return;
  const cnt = {};
  rows.forEach(v => { cnt[v.model] = (cnt[v.model] || 0) + 1; });
  const models = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  const groups = {};
  models.forEach(([m]) => { (groups[normModel(m)] = groups[normModel(m)] || []).push(m); });
  const selC = el('select', { class: 'input', style: 'max-width:220px' }, el('option', { value: '' }, 'Усі міста'), ...cities.map(x => el('option', { value: x.id, selected: md.city === x.id }, x.name)));
  const selE = el('select', { class: 'input', style: 'max-width:240px' }, el('option', { value: '' }, 'Усі підприємства'), ...ents.filter(x => !md.city || x.city_id === md.city).map(x => el('option', { value: x.id, selected: md.ent === x.id }, x.name)));
  selC.addEventListener('change', () => { md.city = selC.value; md.ent = ''; pgModels(++renderTok); });
  selE.addEventListener('change', () => { md.ent = selE.value; pgModels(++renderTok); });
  const withPhotos = el('input', { type: 'checkbox', checked: true });
  const simCount = Object.values(groups).filter(g => g.length > 1).length;
  show(
    el('div', { class: 'toolbar' }, selC, selE, el('label', { class: 'sub', style: 'display:inline-flex;gap:6px;align-items:center' }, withPhotos, 'оновлювати й модель у фото')),
    el('p', { class: 'sub' }, 'Моделей: ' + models.length + ' · машин: ' + rows.length + (simCount ? ' · схожих назв (імовірні дублі): ' + simCount : '')),
    el('div', { class: 'panel' }, models.length ? models.map(([m, n]) => {
      const inp = el('input', { class: 'input', value: m, style: 'max-width:300px' });
      const similar = (groups[normModel(m)] || []).filter(x => x !== m).sort((a, b) => cnt[b] - cnt[a])[0];
      const go = el('button', { class: 'btn small', onclick: () => mdRename(m, inp.value, withPhotos.checked) }, 'Перейменувати');
      return el('div', { class: 'row' },
        el('div', { class: 'info' }, el('p', null, el('b', null, m)), el('p', { class: 'sub' }, n + ' ТЗ' + (similar ? ' · схоже на «' + similar + '» (' + cnt[similar] + ')' : ''))),
        el('div', { class: 'acts' }, inp, similar ? el('button', { class: 'btn small', title: 'Підставити цю назву', onclick: () => { inp.value = similar; } }, '→ ' + similar) : null, go));
    }) : el('div', { class: 'empty' }, 'ТЗ немає')));
}
async function mdRename(old, neu, alsoPhotos) {
  neu = String(neu || '').trim();
  if (!neu || neu === old) { toast('Введіть нову назву', 'err'); return; }
  const scopeTxt = md.ent ? 'у вибраному підприємстві' : md.city ? 'у вибраному місті' : 'у всій базі';
  if (!(await askConfirm('Перейменувати модель?', '«' + old + '» → «' + neu + '» ' + scopeTxt + (alsoPhotos ? ', разом з фото' : '') + '.', 'Перейменувати', false))) return;
  const scope = q => { if (md.city) q = q.eq('city_id', md.city); if (md.ent) q = q.eq('enterprise_id', md.ent); return q; };
  const v = await scope(db.from('vehicles').update({ model: neu }).eq('model', old)).select('id');
  if (v.error) { toast(v.error.message, 'err'); return; }
  let ph = 0;
  if (alsoPhotos) {
    const p = await scope(db.from('photos').update({ model: neu }).eq('model', old)).select('id');
    if (p.error) toast('Фото: ' + p.error.message, 'err'); else ph = (p.data || []).length;
  }
  await logAction('model_rename', null, '«' + old + '» → «' + neu + '»: ТЗ ' + (v.data || []).length + ', фото ' + ph);
  toast('Готово: ТЗ ' + (v.data || []).length + ', фото ' + ph);
  pgModels(++renderTok);
}

async function hsRevert(h, cName) {
  const title = { update: 'Відкотити цю зміну?', delete: 'Відновити видалену машину?', create: 'Скасувати додавання (видалити машину)?' }[h.action];
  if (!(await askConfirm(title, 'Борт ' + (h.fleet_no || '—') + ' · ' + (h.model || ''), 'Підтвердити', h.action === 'create'))) return;
  if (h.action === 'update') {
    const patch = {};
    Object.entries(h.changes || {}).forEach(([k, p2]) => { if (k !== 'owner_id') patch[k] = p2[0]; });
    const e = await upd('vehicles', patch, h.vehicle_id);
    if (e) { toast(/не знайдено/.test(e) ? 'Машини вже немає в базі: спершу відновіть її через запис «видалив»' : e, 'err'); return; }
  } else if (h.action === 'delete') {
    if (!h.snapshot) { toast('Немає знімка запису для відновлення', 'err'); return; }
    const { error } = await db.from('vehicles').insert(h.snapshot);
    if (error) { toast(error.message, 'err'); return; }
  } else {
    const e = await del('vehicles', h.vehicle_id);
    if (e) { toast(e, 'err'); return; }

  await logAction('vehicle_revert', cName[h.city_id] || null, h.action + ': ' + (h.fleet_no || '') + ' ' + (h.model || ''));
  toast('Готово');
  pgHistory(++renderTok);
}

/* ============================ ПЕРЕВІРКА БАЗИ ============================ */
async function pgHealth(tok) {
  show(el('p', { class: 'sub' }, 'Перевіряю базу… це може тривати кілька секунд.'));
  let cities; let ents; let vehs; let phs;
  try {
    [cities, ents, vehs, phs] = await Promise.all([
      fetchAllA('cities', 'id, name, is_published', q => q, 5000),
      fetchAllA('enterprises', 'id, name, city_id', q => q, 5000),
      fetchAllA('vehicles', 'id, city_id, enterprise_id, fleet_no, plate_no, model, status', q => q, 30000),
      fetchAllA('photos', 'id, city_id, enterprise_id, fleet_no, plate_no, model, transport, status, created_at', q => q, 50000)
    ]);
  } catch (err) { show(el('div', { class: 'panel' }, el('div', { class: 'empty' }, err.message))); return; }
  if (stale(tok)) return;
  const cName = Object.fromEntries(cities.map(c => [c.id, c.name]));
  const eName = Object.fromEntries(ents.map(e => [e.id, e.name]));
  const rerun = () => pgHealth(++renderTok);

  /* A. дублікати бортових номерів у підприємстві */
  const dupMap = {};
  vehs.forEach(v => { const k = v.enterprise_id + '|' + String(v.fleet_no).trim(); (dupMap[k] = dupMap[k] || []).push(v); });
  const dups = Object.values(dupMap).filter(g => g.length > 1).sort((a, b) => natA(a[0].fleet_no, b[0].fleet_no));

  /* B. фото, для яких немає ТЗ */
  const vKeys = new Set(Object.keys(dupMap));
  const orphMap = {};
  phs.forEach(p => {
    const fn = String(p.fleet_no || '').trim();
    if (!fn || !p.enterprise_id) return;
    const k = p.enterprise_id + '|' + fn;
    if (vKeys.has(k)) return;
    (orphMap[k] = orphMap[k] || []).push(p);
  });
  const orphans = Object.entries(orphMap).sort((a, b) => b[1].length - a[1].length);

  /* C/D. порожні підприємства й міста */
  const entsWith = new Set(vehs.map(v => v.enterprise_id));
  const emptyEnts = ents.filter(e => !entsWith.has(e.id));
  const citiesWithEnts = new Set(ents.map(e => e.city_id));
  const emptyCities = cities.filter(c => c.is_published && !citiesWithEnts.has(c.id));

  /* E. давні фото на модерації */
  const oldPending = phs.filter(p => p.status === 'pending' && Date.now() - new Date(p.created_at).getTime() > 7 * 864e5);

  /* F. схожі назви моделей */
  const mc = {};
  vehs.forEach(v => { mc[v.model] = (mc[v.model] || 0) + 1; });
  const gm = {};
  Object.keys(mc).forEach(m => { (gm[normModel(m)] = gm[normModel(m)] || []).push(m); });
  const similar = Object.values(gm).filter(g => g.length > 1);

  const check = (title, items, draw, okText, hint) => {
    if (!items.length) return el('div', { class: 'panel' }, el('div', { class: 'row' }, el('span', { class: 'tag ok' }, '✓'), el('div', { class: 'info' }, el('b', null, title), el('p', { class: 'sub' }, okText))));
    const more = items.length > 100 ? el('div', { class: 'row' }, el('span', { class: 'sub' }, 'Показано перші 100 із ' + items.length)) : null;
    const d = el('details', null, el('summary', { style: 'cursor:pointer;padding:12px 16px;font-weight:600' }, '⚠ ' + title + ': ' + items.length, hint ? el('span', { class: 'sub', style: 'font-weight:400' }, ' · ' + hint) : null), ...items.slice(0, 100).map(draw), more);
    return el('div', { class: 'panel' }, d);
  };

  show(
    el('div', { class: 'cards' },
      el('div', { class: 'stat' }, el('b', null, vehs.length.toLocaleString('uk-UA')), el('span', null, 'ТЗ у базі')),
      el('div', { class: 'stat' }, el('b', null, phs.length.toLocaleString('uk-UA')), el('span', null, 'фото у базі')),
      el('div', { class: 'stat' + (dups.length ? ' warn' : '') }, el('b', null, dups.length), el('span', null, 'груп-дублікатів')),
      el('div', { class: 'stat' + (orphans.length ? ' warn' : '') }, el('b', null, orphans.length), el('span', null, 'номерів на фото без ТЗ'))),
    el('div', { class: 'toolbar' }, el('button', { class: 'btn', onclick: rerun }, '↻ Перевірити ще раз')),
    check('Однакові бортові номери в одному підприємстві', dups, g => el('div', { class: 'row' },
      el('div', { class: 'info' }, el('p', null, el('b', null, g[0].fleet_no), ' · ' + (eName[g[0].enterprise_id] || '') + ' · ' + (cName[g[0].city_id] || '')),
        ...g.map(v => el('p', { class: 'sub' }, v.model + ' · ' + stLabelA(v.status) + ' · ' + (v.plate_no || 'без держ. №')))),
      el('div', { class: 'acts' }, ...g.slice(1).map(v => el('button', { class: 'btn small danger', title: 'Видалити цей запис', onclick: async () => {
        const reason = await askReason('Видалити дублікат ' + v.fleet_no + ' (' + v.model + ')?', 'Видалити');
        if (!reason) return;
        const e = await del('vehicles', v.id);
        if (e) { toast(e, 'err'); return; }
        await logAction('vehicle_delete', cName[v.city_id], 'дублікат ' + v.fleet_no + ' ' + v.model + '. ' + reason);
        toast('Видалено'); rerun(); } }, '🗑 ' + v.model)))),
      'Дублікатів немає', 'видаліть зайвий запис'),
    check('Фото з бортовим номером, якого немає в базі транспорту', orphans, ([k, list]) => {
      const p0 = list[0];
      return el('div', { class: 'row' },
        el('div', { class: 'info' }, el('p', null, el('b', null, p0.fleet_no), (p0.model ? ' · ' + p0.model : '')), el('p', { class: 'sub' }, (eName[p0.enterprise_id] || '') + ' · ' + (cName[p0.city_id] || '') + ' · фото: ' + list.length)),
        el('div', { class: 'acts' }, el('button', { class: 'btn small primary', onclick: async () => {
          const tp = IMP_TYPES.some(x => x[0] === p0.transport) ? p0.transport : 'bus';
          const { error } = await db.from('vehicles').insert({ city_id: p0.city_id, enterprise_id: p0.enterprise_id, owner_id: me.id, fleet_no: String(p0.fleet_no).trim(), plate_no: p0.plate_no || null, vehicle_type: tp, model: p0.model || 'Невідомо', status: 'active' });
          if (error) { toast(error.message, 'err'); return; }
          await logAction('vehicle_create', cName[p0.city_id], p0.fleet_no + ' із фото');
          toast('ТЗ створено. Уточніть його дані на сторінці «Транспорт»'); rerun(); } }, '＋ Створити ТЗ')));
    }, 'Для кожного фото є ТЗ', 'створіть ТЗ одним кліком'),
    check('Підприємства без жодної машини', emptyEnts, e => el('div', { class: 'row' }, el('div', { class: 'info' }, el('p', null, el('b', null, e.name)), el('p', { class: 'sub' }, cName[e.city_id] || ''))), 'У кожного підприємства є транспорт'),
    check('Опубліковані міста без підприємств', emptyCities, c => el('div', { class: 'row' }, el('div', { class: 'info' }, el('p', null, el('b', null, c.name)))), 'У кожного міста є підприємство'),
    check('Фото на модерації понад 7 днів', oldPending, p => el('div', { class: 'row' }, el('div', { class: 'info' }, el('p', null, el('b', null, p.fleet_no || 'без номера'), ' · ' + (p.model || '')), el('p', { class: 'sub' }, (cName[p.city_id] || '') + ' · ' + fmtDate(p.created_at)))), 'Немає застарілих заявок', 'розгляньте на сторінці «Фото»'),
    check('Схожі назви моделей (імовірні дублі)', similar, g => el('div', { class: 'row' }, el('div', { class: 'info' }, el('p', null, g.map(m => '«' + m + '» (' + mc[m] + ')').join(' ≈ '))), el('div', { class: 'acts' }, el('a', { class: 'btn small', href: '#models' }, 'До «Моделі»'))), 'Назви моделей уніфіковані', 'об’єднайте на сторінці «Моделі»'));
}


/* ============================ ШВИДКИЙ ПОШУК (Ctrl+K або /) ============================ */
function openPalette() {
  if (!me || document.querySelector('.dlg.xm.pal')) return;
  const inp = el('input', { class: 'input', placeholder: 'Сторінка, номер ТЗ, нік автора…', autocomplete: 'off' });
  const list = el('div', { style: 'margin-top:10px;display:grid;gap:4px' });
  const ov = xModal([inp, list], 560);
  ov.classList.add('pal');
  ov.firstElementChild.style.marginTop = '8vh';
  let items = []; let idx = 0; let timer;
  const draw = () => list.replaceChildren(...items.map((it, i) => el('button', { class: 'btn' + (i === idx ? ' primary' : ''), style: 'justify-content:flex-start;text-align:left;overflow-wrap:anywhere', onclick: () => run(it) }, it.label)));
  const run = it => { ov.remove(); it.go(); };
  const goVeh = q => { Object.assign(vh, { q, city: '', ent: '', status: '', type: '', issue: '', page: 0 }); vh.sel.clear(); if (location.hash === '#vehicles') route(); else location.hash = '#vehicles'; };
  const search = async () => {
    const q = inp.value.trim().toLowerCase();
    const pages = PAGES.filter(allowed).filter(p => !q || p.title.toLowerCase().includes(q)).map(p => ({ label: p.ico + ' ' + p.title, go: () => { location.hash = '#' + p.id; } }));
    items = pages.slice(0, 8); idx = 0; draw();
    if (q.length < 2) return;
    const s = escLike(q).replace(/[,()"]/g, ' ');
    const [v, u] = await Promise.all([
      db.from('vehicles').select('id, fleet_no, plate_no, model').or('fleet_no.ilike.%' + s + '%,plate_no.ilike.%' + s + '%,vin.ilike.%' + s + '%').limit(6),
      db.from('profiles').select('id, username, role').ilike('username', '%' + s + '%').limit(5)
    ]);
    if (inp.value.trim().toLowerCase() !== q) return;
    items = [...pages.slice(0, 5),
      ...(v.data || []).map(x => ({ label: '🚌 ' + x.fleet_no + ' · ' + x.model + (x.plate_no ? ' · ' + x.plate_no : ''), go: () => goVeh(x.fleet_no) })),
      ...(u.data || []).map(x => ({ label: '👤 ' + x.username + ' (' + x.role + ')', go: () => { usersState.q = x.username; usersState.role = 'all'; usersState.limit = 50; if (location.hash === '#users') route(); else location.hash = '#users'; } }))];
    idx = 0; draw();
  };
  inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 200); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    else if (e.key === 'Enter' && items[idx]) run(items[idx]);
  });
  search();
  inp.focus();
}
document.addEventListener('keydown', e => {
  if (!me) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '') && $('dlg').classList.contains('hidden') && !document.querySelector('.dlg.xm')) { e.preventDefault(); openPalette(); }
});
$('palBtn').addEventListener('click', openPalette);

/* ============================ СТАРТ ============================ */
(async function boot() {
  const { data } = await db.auth.getSession();
  await enter(data.session);
  db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') enter(null); });
})();
</script>
